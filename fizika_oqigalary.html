<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Физика оқиғалары</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Onest:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a 16:9 cartoon stage on the left, a squared-paper school notebook on the right, the task sheet below. */
  --ink:#1b2550;      /* outlines, text */
  --page:#e6ecfb;     /* page background */
  --paper:#fbfcff;    /* cards, notebook paper */
  --hot:#ff5533;      /* the iron: the one loud colour */
  --sun:#ffc533;      /* hotspots, highlights */
  --teal:#1f8f8a;     /* focus, calm accents */
  --rule:#c5d2f3;     /* notebook grid, hairlines */
  --muted:#56618c;
  --ok:#1a8f58; --bad:#cf3a2b;
  --display:"Unbounded","Arial Black","Segoe UI",system-ui,sans-serif;
  --body:"Onest","Segoe UI",Roboto,system-ui,sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:1340px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
button,input,select{font:inherit;color:inherit}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font:800 clamp(18px,2.4vw,24px)/1.1 var(--display);margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

/* sticker buttons */
.btn{font:700 15px/1 var(--body);background:#fff;border:3px solid var(--ink);border-radius:13px;padding:10px 16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
.btn.primary{background:var(--hot);color:#fff}
.btn.sun{background:var(--sun)}
.btn.small{padding:8px 12px;font-size:14px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

/* theatre */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.theatre{min-width:0;display:flex;flex-direction:column;gap:12px;align-items:center}
.stage,.caption,.controls{width:min(100%,max(300px,calc((100vh - 245px) * 1.7778)))}
.stage{position:relative;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--ink);box-shadow:0 7px 0 var(--ink)}
.stage svg{display:block;width:100%;height:100%}
.scene-tag{position:absolute;left:12px;top:12px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font:700 13px/1.2 var(--body)}
.toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;font:700 14px/1.3 var(--body);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.caption{background:#fff3c2;border:3px solid var(--ink);border-radius:16px;padding:10px 16px;min-height:66px;display:flex;align-items:center}
.caption p{margin:0;font-size:clamp(16px,1.6vw,20px);line-height:1.35;font-weight:500;text-wrap:pretty}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff;padding:0;cursor:pointer}
.dot.on{background:var(--hot);transform:scale(1.25)}
.dot.seen{background:var(--ink)}
.dot.on.seen{background:var(--hot)}
.ctl-group{display:flex;gap:8px}

/* notebook: squared school paper with a red margin */
.notebook{background:
    linear-gradient(90deg,transparent 33px,#f29a8e 33px,#f29a8e 35px,transparent 35px),
    linear-gradient(var(--rule) 1px,transparent 1px) 0 0/100% 22px,
    linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/22px 100%,
    var(--paper);
  border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);padding:14px 14px 16px 46px;display:flex;flex-direction:column;gap:6px}
.notebook h2{font:800 17px/1.2 var(--display);margin:0}
.notebook .hint{font-size:13.5px;line-height:1.35;color:var(--muted);margin:0 0 4px}
.nb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nb-list li{min-height:44px;display:flex;flex-direction:column;justify-content:center}
.nb-list .k{font:700 12px/1.2 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.nb-list .v{font:700 23px/1.05 var(--hand);color:#2337a8}
.nb-list li.empty .v{color:#9aa6cf;font:500 20px/1.05 var(--hand)}
.nb-list li.empty button{all:unset;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.nb-list li.new .v{animation:ink .7s ease}
@keyframes ink{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.nb-count{font:700 14px/1.2 var(--body);margin:6px 0 8px}

/* task sheet */
.task{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:clamp(16px,3vw,30px);display:flex;flex-direction:column;gap:18px;scroll-margin-top:12px}
.task h2{font:800 clamp(20px,2.6vw,28px)/1.15 var(--display);margin:0;text-wrap:balance}
.task .lead{font-size:clamp(17px,1.8vw,20px);max-width:68ch;margin:0}
.task .lead strong{background:linear-gradient(transparent 62%,#ffd9cf 62%)}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.step{border:2px solid var(--ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#fff}
.step.wide{grid-column:1/-1}
.step h3{font:700 17px/1.3 var(--body);margin:0;display:flex;gap:10px;align-items:baseline}
.step h3 .n{font:800 14px/1 var(--display);background:var(--ink);color:#fff;border-radius:8px;padding:5px 8px;flex:none}
.step p{margin:0;font-size:15.5px;color:var(--muted)}
.step.done{border-color:var(--ok);box-shadow:inset 6px 0 0 var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 16px/1 var(--body);font-variant-numeric:tabular-nums;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sun)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700;font-size:18px}
.row input{width:104px;font:700 18px/1 var(--body);font-variant-numeric:tabular-nums;border:2px solid var(--ink);border-radius:10px;padding:9px 10px;background:#fff}
.row input.good{border-color:var(--ok);background:#e9f8f0}
.row input.wrong{border-color:var(--bad);background:#fdecea}
.fb{font-size:15px;font-weight:500;min-height:0}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.answer{border:3px solid var(--ink);border-radius:16px;background:var(--sun);padding:14px 18px;font:800 clamp(18px,2.4vw,24px)/1.25 var(--display)}
.answer small{display:block;font:500 16px/1.4 var(--body);margin-top:6px}
.solution{border:2px dashed var(--ink);border-radius:16px;padding:14px 18px;background:#fff;font-size:17px}
.solution h3{margin:0 0 6px;font:700 17px/1.3 var(--body)}
.solution p{margin:4px 0;font-variant-numeric:tabular-nums}
.talk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.talk details{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:12px 14px}
.talk summary{cursor:pointer;font-weight:700;line-height:1.35}
.talk details p{margin:8px 0 0;font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.teacher{border-top:2px solid var(--rule);padding-top:14px}
.teacher summary{cursor:pointer;font-weight:700}
.teacher .fields{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;align-items:end}
.teacher label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.teacher select,.teacher input{border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:#fff;font-weight:700;width:150px}
.foot{font-size:14px;color:var(--muted);text-align:center}
h2.section{font:800 18px/1.2 var(--display);margin:6px 0 0}

/* zoom dialog */
.zoom{position:fixed;inset:0;background:rgba(27,37,80,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.zoom[hidden]{display:none}
.zoom-card{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:18px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.zoom-card h2{font:800 18px/1.2 var(--display);margin:0}
.plate{border:3px solid #8d98ab;border-radius:12px;background:linear-gradient(#f3f5f9,#dfe4ec);padding:16px;text-align:center;font-family:var(--body)}
.plate .b{font:700 13px/1.2 var(--body);letter-spacing:.14em;color:#5a6278}
.plate .big{font:800 clamp(22px,6vw,30px)/1.25 var(--display);margin:10px 0;font-variant-numeric:tabular-nums}
.plate .s{font-size:13px;color:#5a6278}
.bill{border:2px solid var(--rule);border-radius:8px;background:#fff;padding:14px;font-size:15.5px}
.bill .hd{display:flex;justify-content:space-between;gap:8px;font:800 15px/1.2 var(--display);border-bottom:3px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.bill .ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--rule);font-variant-numeric:tabular-nums}
.bill .ln b{white-space:nowrap}
.bill .tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding-top:8px}

/* ---------- scene animation ---------- */
.scene{display:none}
.scene.on{display:inline}
.scene.on.fade{animation:sceneIn .45s ease}
@keyframes sceneIn{from{opacity:0}to{opacity:1}}
.b2{opacity:0;visibility:hidden}
.scene.beat2 .b2{opacity:1;visibility:visible;transition:opacity .35s}
.scene.beat2 .b1{opacity:0;visibility:hidden}
.t-display{font-family:var(--display);font-weight:800}
.t-bold{font-family:var(--body);font-weight:700}
.t-body{font-family:var(--body);font-weight:500}
.t-digit{font-family:"Courier New",ui-monospace,monospace;font-weight:700}

.sw{animation:swing var(--d,.36s) ease-in-out infinite alternate;transform-origin:0 0}
.sw.b{animation-direction:alternate-reverse}
@keyframes swing{from{transform:rotate(var(--a,26deg))}to{transform:rotate(calc(-1 * var(--a,26deg)))}}
.bob{animation:bob var(--d,.36s) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.puff{animation:puff 2.8s ease-out infinite;opacity:0}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}18%{opacity:.85}100%{transform:translate(var(--dx,10px),-130px) scale(1.7);opacity:0}}
.blink{animation:blink .8s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.35}to{opacity:1}}
.shake{animation:shake .12s linear infinite alternate}
@keyframes shake{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.zz{animation:zz 3s ease-in-out infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(26px,-46px)}}
.breathe{animation:breathe 2.6s ease-in-out infinite alternate;transform-origin:1200px 652px}
@keyframes breathe{from{transform:scaleY(1)}to{transform:scaleY(1.05)}}
.sunrise{animation:sunrise 7s ease-out both}
@keyframes sunrise{from{transform:translateY(70px)}to{transform:translateY(0)}}
.rays{animation:spin 80s linear infinite;transform-origin:1185px 560px}
@keyframes spin{to{transform:rotate(360deg)}}
.brush{animation:brush .16s ease-in-out infinite alternate}
@keyframes brush{from{transform:translateX(-4px)}to{transform:translateX(5px)}}
.float{animation:floatUp 3.4s ease-in infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-190px);opacity:0}}
.flow{animation:flow .5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.scene.beat2 .pop,.pop.now{animation:pop .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.exit-run{animation:exitRun 2.7s cubic-bezier(.5,0,.9,.6) .5s both}
@keyframes exitRun{to{transform:translateX(1200px)}}
.warn{animation:pop .5s cubic-bezier(.3,1.7,.5,1) 2.8s both;transform-origin:1053px 320px}
.scrollL{animation:scrollL 5s cubic-bezier(.3,.1,.3,1) both}
@keyframes scrollL{from{transform:translateX(0)}to{transform:translateX(-1600px)}}
.scrollR{animation:scrollR 2.4s linear infinite}
@keyframes scrollR{from{transform:translateX(-1600px)}to{transform:translateX(0)}}
.whoosh{stroke-dasharray:90 160;animation:whoosh .5s linear infinite}
@keyframes whoosh{to{stroke-dashoffset:-250}}
.cloud{animation:drift 40s linear infinite alternate}
@keyframes drift{to{transform:translateX(120px)}}

/* hotspots */
.hot{cursor:pointer;outline:none}
.hot-hit{fill:transparent}
.hot-ring{fill:rgba(255,197,51,.14);stroke:var(--sun);stroke-width:7;stroke-dasharray:16 13;animation:dash 5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-290}}
.hot:hover .hot-ring,.hot:focus-visible .hot-ring{fill:rgba(255,197,51,.32);stroke:#fff}
.hot .ic-check{display:none}
.hot.found .hot-ring{stroke:#2fd08a;fill:rgba(47,208,138,.12);stroke-dasharray:none;animation:none}
.hot.found .ic-check{display:inline}
.hot.found .ic-find{display:none}
.hot.found .hot-badge circle{fill:#2fd08a}

@media (max-width:920px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .steps,.talk{grid-template-columns:minmax(0,1fr)}
  .nb-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
}
@media (max-width:520px){
  .nb-list{grid-template-columns:minmax(0,1fr)}
  .controls{justify-content:center}
  .btn{padding:10px 13px}
  .stage{border-radius:16px}
}
@media (prefers-reduced-motion:reduce){
  .sw,.bob,.puff,.blink,.shake,.zz,.breathe,.rays,.brush,.float,.flow,.scrollR,.whoosh,.cloud,.hot-ring{animation:none}
  .puff,.zz,.float{opacity:.7}
  .sunrise,.exit-run,.warn,.scrollL,.scene.on.fade{animation-duration:.01s;animation-delay:0s}
}
.eps{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.ep-tab{flex:none;display:flex;align-items:center;gap:9px;font:700 14px/1.2 var(--body);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:7px 13px 7px 7px;box-shadow:0 3px 0 var(--ink);cursor:pointer;text-align:left;max-width:250px}
.ep-tab .num{font:800 14px/1 var(--display);background:var(--ink);color:#fff;border-radius:9px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.ep-tab small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:1px}
.ep-tab[aria-current="true"]{background:var(--sun)}
.ep-tab[aria-current="true"] .num{background:var(--hot)}
.ep-tab.done small::after{content:" · шешілді";color:var(--ok);font-weight:700}
.ref{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14.5px}
.ref span{border:1.5px dashed var(--ink);border-radius:8px;padding:4px 8px;background:#fff;font-variant-numeric:tabular-nums}
.step.predict{background:#fff3c2}
.rows{display:flex;flex-direction:column;gap:8px}
.row input{width:132px}
.row label{font-weight:700}
.verdict{display:block;font:700 16px/1.4 var(--body);margin-top:6px}
.dot.lock{background:repeating-linear-gradient(45deg,#fff 0 3px,#aab4c4 3px 6px)}
.t-hand{font-family:var(--hand);font-weight:700}
.snow{animation:snow 5s linear infinite}
@keyframes snow{from{transform:translateY(0)}to{transform:translateY(1000px)}}
.flick{animation:flick .26s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.93,1.12)}}
.spin{animation:spin 1.6s linear infinite}
.drip{animation:drip 3.6s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
@media (prefers-reduced-motion:reduce){.snow,.flick,.spin,.drip{animation:none}.drip{opacity:1}}
.stage,.caption,.controls{width:min(100%,max(300px,calc((100vh - 322px) * 1.7778)))}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#1b2550"/><circle cx="24" cy="24" r="14" fill="#ffc533"/><path d="M20,16 L33,24 L20,32 Z" fill="#1b2550"/></svg>
      <div>
        <h1>Физика оқиғалары</h1>
        <p>Функционалдық сауаттылық · 8-сынып, §7–§12 · 6 мультфильм</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn small" id="btnSound" type="button" aria-pressed="true">Дыбыс: қосулы</button>
      <button class="btn small" id="btnFull" type="button">Толық экран</button>
    </div>
  </header>
  <nav class="eps" id="eps" aria-label="Оқиғалар"></nav>
  <main class="layout">
    <section class="theatre" aria-label="Мультфильм">
      <div class="stage" id="stage">
        <svg id="svg" viewBox="0 0 1600 900" role="img" aria-label="Физика оқиғасы туралы мультфильм"></svg>
        <div class="scene-tag" id="tag"></div>
        <div class="toast" id="toast" role="status"></div>
      </div>
      <div class="caption" aria-live="polite"><p id="cap"></p></div>
      <div class="controls">
        <button class="btn" id="btnPrev" type="button">◂ Артқа</button>
        <div class="dots" id="dots"></div>
        <div class="ctl-group">
          <button class="btn sun" id="btnAuto" type="button" aria-pressed="false">▶ Өзі ойнасын</button>
          <button class="btn primary" id="btnNext" type="button">Бастау ▸</button>
        </div>
      </div>
    </section>
    <aside class="notebook" aria-label="Дерек дәптері">
      <h2>Дерек дәптері</h2>
      <p class="hint">Көріністегі сары шеңберді бас. Табылған дерек осы дәптерге жазылады.</p>
      <ul class="nb-list" id="nbList"></ul>
      <p class="nb-count" id="nbCount"></p>
      <button class="btn small primary" id="btnToTask" type="button">Есепке өту ▾</button>
    </aside>
  </main>
  <section class="task" id="task" aria-labelledby="taskTitle"></section>
  <p class="foot">Авторы: Ысмайл Рамазан Оразханұлы, физика пәні мұғалімі</p>
</div>
<div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-labelledby="zoomTitle">
  <div class="zoom-card">
    <h2 id="zoomTitle"></h2>
    <div id="zoomBody"></div>
    <button class="btn primary" id="zoomClose" type="button">Жабу</button>
  </div>
</div>
<script>
(() => {
'use strict';
const SK='#f6c9a0', SK2='#e8b088', HAIR='#2a1d16', INK='#1b2550', PJ='#9fd3ff';
const r1=n=>Math.round(n*10)/10;

/* ================= drawing helpers ================= */
function limb(x1,y1,x2,y2,w,col,bend=0){
  const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
  return `<path d="M${r1(x1)},${r1(y1)} Q${r1(mx-dy/L*bend)},${r1(my+dx/L*bend)} ${r1(x2)},${r1(y2)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
}
function head(c={}){
  const f=c.face||'smile', lk=c.look||0, e1=-22+lk, e2=22+lk;
  const eye=x=>`<ellipse cx="${x}" cy="-2" rx="8.5" ry="11" fill="#1c1a26"/><circle cx="${x+3}" cy="-6" r="3.2" fill="#fff"/>`;
  const wide=x=>`<circle cx="${x}" cy="-4" r="16" fill="#fff" stroke="#1c1a26" stroke-width="3"/><circle cx="${x+lk*.3}" cy="-3" r="6.5" fill="#1c1a26"/>`;
  const arcD=x=>`<path d="M${x-10},-3 Q${x},8 ${x+10},-3" fill="none" stroke="#1c1a26" stroke-width="5" stroke-linecap="round"/>`;

/* sound */
function tone(f,d,type='sine',v=.07,when=0){
  if(!sound||!AC)return;
  try{const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const sfx={
  next:()=>tone(520,.09,'triangle',.05),
  boing:()=>{tone(300,.12,'triangle',.07);tone(620,.2,'triangle',.07,.1);},
  found:()=>{tone(660,.12,'sine',.08);tone(990,.22,'sine',.08,.11);},
  ok:()=>{[523,659,784].forEach((f,i)=>tone(f,.2,'sine',.08,i*.11));},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.26,'triangle',.08,i*.13));},
  stop:()=>{tone(440,.18,'square',.04);tone(330,.3,'square',.04,.18);},
  no:()=>tone(170,.25,'sawtooth',.04)
};
const wakeAudio=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}};
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,wakeAudio,{passive:true}));

/* ================= theatre ================= */
function clearTimers(){timers.forEach(clearTimeout);timers=[];clearInterval(cdT);}
const setCap=t=>{$('cap').textContent=t;};
let toastT;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2800);}
function toTask(){$('task').scrollIntoView({behavior:'smooth',block:'start'});}
function show(i,fade=true){
  i=Math.max(0,Math.min(scenes.length-1,i));
  if(i===iTwist()&&!S().solved&&!S().open){toast('Түйін есеп шыққан соң ашылады');toTask();return;}
  clearTimers();
  scenes.forEach(s=>s.classList.remove('on','beat2','fade'));
  cur=i;const el=scenes[i];void el.getBoundingClientRect();
  el.classList.add('on');if(fade)el.classList.add('fade');
  const m=META[i];setCap(m.beats[0].text);
  $('tag').textContent=i===0?`${EP.n}-оқиға`:`${EP.n}-оқиға · ${m.name}`;
  if(m.beats[1])timers.push(setTimeout(()=>{el.classList.add('beat2');setCap(m.beats[1].text);sfx.boing();},m.beats[1].t));
  const cd=el.querySelector('[data-cd]');
  if(cd){let v=+cd.dataset.cd;const mn=+cd.dataset.min,put=()=>{cd.textContent='0'+Math.floor(v/60)+':'+String(v%60).padStart(2,'0');};put();cdT=setInterval(()=>{if(v>mn){v--;put();tone(880,.03,'square',.015);}},1000);}
  if(fade&&i===iStop())sfx.stop();
  if(fade&&i===iTwist())sfx.win();
  $('btnPrev').disabled=i===0;
  $('btnNext').textContent=i===0?'Бастау ▸':i===iStop()?(S().solved||S().open?'Түйінді көру ▸':'Есепке өту ▾'):i===iTwist()?(epi<EPS.length-1?'Келесі оқиға ▸':'Басына ▸'):'Келесі ▸';
  [...$('dots').children].forEach((d,k)=>{d.classList.toggle('on',k===i);d.setAttribute('aria-current',k===i?'true':'false');d.classList.toggle('lock',k===iTwist()&&!S().solved&&!S().open);});
  clearTimeout(autoT);
  if(auto){const hold=(m.beats[1]?m.beats[1].t:0)+(i===0?4000:7000);autoT=setTimeout(()=>{if(cur<iStop())show(cur+1);else setAuto(false);},hold);}
}
function setAuto(v){auto=v;$('btnAuto').setAttribute('aria-pressed',v);$('btnAuto').textContent=v?'❚❚ Тоқтату':'▶ Өзі ойнасын';clearTimeout(autoT);if(v)show(cur>=iStop()?0:cur,false);}
function next(){
  if(cur===iStop()){if(S().solved||S().open)show(iTwist());else toTask();return;}
  if(cur===iTwist()){loadEp((epi+1)%EPS.length);$('stage').scrollIntoView({behavior:'smooth',block:'nearest'});return;}
  sfx.next();show(cur+1);
}
function loadEp(i,sc=0){
  epi=i;EP=EPS[i];uid=0;setAuto(false);
  META=[{name:'Басы',beats:[{t:0,text:EP.hook}]},...EP.scenes.map(s=>({name:s.name,beats:s.beats})),{name:'Тоқта!',beats:[{t:0,text:'Мультфильм кідірді. Болжам жаса, дәптерге дерек жина, есепті шығар. Оқиғаның түйіні есеп шыққан соң ашылады.'}]},{name:'Түйін',beats:[{t:0,text:EP.twist.text}]}];
  const draws=[()=>titleScene(EP),...EP.scenes.map(s=>s.draw),()=>stopScene(EP),EP.twist.draw];
  svg.innerHTML=DEFS2+draws.map((f,k)=>`<g class="scene" id="s${k}">${f()}</g>`).join('');
  scenes=[...svg.querySelectorAll('.scene')];
  $('dots').innerHTML=META.map((m,k)=>`<button class="dot" type="button" aria-label="${m.name}"></button>`).join('');
  [...$('dots').children].forEach((d,k)=>d.addEventListener('click',()=>{sfx.next();show(k);}));
  [...$('eps').children].forEach((b,k)=>{b.setAttribute('aria-current',k===i?'true':'false');b.classList.toggle('done',ST[k].solved);});
  renderTask();renderNotebook();show(sc,false);
  try{if(location.hash!=='#ep-'+(i+1))location.hash='ep-'+(i+1);}catch(e){}
}
$('eps').innerHTML=EPS.map(e=>`<button class="ep-tab" type="button"><span class="num">${e.n}</span><span>${e.title}<small>${e.para} · ${e.sub}</small></span></button>`).join('');
[...$('eps').children].forEach((b,k)=>b.addEventListener('click',()=>{sfx.next();loadEp(k);}));
$('btnNext').addEventListener('click',next);
$('btnPrev').addEventListener('click',()=>{sfx.next();show(cur-1);});
$('btnAuto').addEventListener('click',()=>setAuto(!auto));
$('btnToTask').addEventListener('click',toTask);
$('btnSound').addEventListener('click',()=>{sound=!sound;$('btnSound').setAttribute('aria-pressed',sound);$('btnSound').textContent=sound?'Дыбыс: қосулы':'Дыбыс: өшірулі';});
$('btnFull').addEventListener('click',()=>{try{if(document.fullscreenElement){document.exitFullscreen();}else{const p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Бұл терезеде толық экран ашылмады'));}}catch(e){toast('Бұл терезеде толық экран ашылмады');}});
document.addEventListener('keydown',e=>{
  if(!$('zoom').hidden){if(e.key==='Escape')closeZoom();return;}
  if(/INPUT|SELECT|TEXTAREA|BUTTON|SUMMARY/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowRight'){e.preventDefault();next();}
  if(e.key==='ArrowLeft'){e.preventDefault();show(cur-1);}
});
window.addEventListener('hashchange',()=>{const m=/^#ep-(\d)$/.exec(location.hash);if(m){const k=+m[1]-1;if(k>=0&&k<EPS.length&&k!==epi)loadEp(k);}});

/* ================= notebook, hotspots, zoom ================= */
function renderNotebook(newKey){
  const f=S().found;
  $('nbList').innerHTML=EP.data.map(d=>f.has(d.k)
    ?`<li class="${d.k===newKey?'new':''}"><span class="k">${d.title}</span><span class="v">${d.val}</span></li>`
    :`<li class="empty"><span class="k">${d.title}</span><span class="v"><button type="button" data-go="${d.sc}">? ${d.sc}-көріністен ізде</button></span></li>`).join('');
  $('nbCount').textContent=`Табылғаны: ${f.size} / ${EP.data.length}`;
  svg.querySelectorAll('.hot').forEach(h=>h.classList.toggle('found',f.has(h.dataset.key)));
}
$('nbList').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){show(+b.dataset.go);$('stage').scrollIntoView({behavior:'smooth',block:'nearest'});}});
let lastFocus=null;
function openZoom(z){$('zoomTitle').textContent=z.title;$('zoomBody').innerHTML=z.html;lastFocus=document.activeElement;$('zoom').hidden=false;$('zoomClose').focus();}
function closeZoom(){$('zoom').hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
$('zoomClose').addEventListener('click',closeZoom);
$('zoom').addEventListener('click',e=>{if(e.target===$('zoom'))closeZoom();});
function hit(h){
  const d=EP.data.find(x=>x.k===h.dataset.key);if(!d)return;
  const isNew=!S().found.has(d.k);S().found.add(d.k);renderNotebook(isNew?d.k:null);
  if(isNew)sfx.found();
  if(d.zoom)openZoom(d.zoom);else toast(`${isNew?'Дәптерге жазылды. ':''}${d.title}: ${d.val}`);
}
svg.addEventListener('click',e=>{const h=e.target.closest('.hot');if(h)hit(h);});
svg.addEventListener('keydown',e=>{const h=e.target.closest('.hot');if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();hit(h);}});

/* ================= task ================= */
const num=v=>{const x=parseFloat(String(v).replace(/[\s ]/g,'').replace(',','.'));return isNaN(x)?null:x;};
const near=(v,a,tol)=>v!==null&&Math.abs(v-a)<=(tol!=null?tol:Math.max(.006,Math.abs(a)*.006));
function renderTask(){
  const e=EP,s=S();
  const chipsHtml=(arr,cls,sel)=>arr.map((t,i)=>`<button type="button" class="chip ${cls}" data-i="${i}" aria-pressed="${sel(i)}">${t}</button>`).join('');
  let h=`<h2 id="taskTitle">${e.n}-оқиға. ${e.title.replace(/,$/,"")}: есеп</h2><p class="lead">${e.lead}</p>
  <div class="step wide predict" id="stP"><h3><span class="n">?</span>Болжам: ${e.predict.q}</h3><p>Есептемей тұрып таңда. Кейін есеп болжамыңды тексереді.</p><div class="chips" id="pred">${chipsHtml(e.predict.opts,'pr',i=>s.pred===i)}</div></div>
  <div class="ref"><b>Анықтама:</b>${e.ref.map(r=>`<span>${r}</span>`).join('')}</div>
  <div class="steps"><div class="step wide${s.chips?' done':''}" id="st0"><h3><span class="n">1</span>Қажетті деректерді таңда</h3><p>Мультфильмдегі деректердің бәрі бірдей керек емес. Есепке қажеттерін ғана белгіле.</p>
  <div class="chips" id="chips">${chipsHtml(e.data.map(d=>d.chip||d.val),'dc',()=>false)}</div><div class="tools"><button class="btn small" type="button" data-chk="chips">Тексеру</button><span class="fb" id="fb0" role="status"></span></div></div>`;
  e.qs.forEach((q,i)=>{
    const wide=q.c||q.f.length>2;
    h+=`<div class="step${wide?' wide':''}${s.okq.has(i)?' done':''}" id="st${i+1}"><h3><span class="n">${i+2}</span>${q.t}</h3>`;
    if(q.c)h+=`<div class="chips" data-qc="${i}">${chipsHtml(q.c,'qc',k=>s.pick[i]===k)}</div>`;
    else h+=`<div class="rows">${q.f.map((f,j)=>`<div class="row"><label for="q${i}_${j}">${f.l}</label><input id="q${i}_${j}" inputmode="decimal" autocomplete="off" value="${s.vals[i+'_'+j]||''}"> ${f.u}</div>`).join('')}</div>`;
    h+=`<div class="tools"><button class="btn small" type="button" data-chk="${i}">Тексеру</button><span class="fb${s.okq.has(i)?' ok':''}" id="fb${i+1}" role="status">${s.okq.has(i)?'Дұрыс! '+q.ok:''}</span></div></div>`;
  });
  h+=`</div><div class="answer" id="answer" hidden></div>
  <div class="tools"><button class="btn small" type="button" id="btnSol" aria-expanded="false">Шешімін көрсету</button><button class="btn small" type="button" id="btnReset">Жауаптарды тазалау</button><button class="btn small" type="button" id="btnOpen">Мұғалімге: түйінді бірден ашу</button></div>
  <div class="solution" id="solution" hidden><h3>Шешуі</h3>${e.qs.map((q,i)=>`<p><b>${i+2}.</b> ${q.ok}</p>`).join('')}${e.note?`<p style="color:var(--muted)">Ескерту: ${e.note}</p>`:''}<h3 style="margin-top:10px">Жауабы: ${e.answer}</h3></div>
  <h2 class="section">Ойлан, талқыла</h2><div class="talk">${e.talk.map(t=>`<details><summary>${t[0]}</summary><p>${t[1]}</p></details>`).join('')}</div>`;
  $('task').innerHTML=h;
  if(s.solved)showAnswer(false);
}
function fb(n,ok,text){const el=$('fb'+n);el.textContent=text;el.className='fb '+(ok?'ok':'no');$('st'+n).classList.toggle('done',ok);}
function showAnswer(fresh){
  const e=EP,s=S(),a=$('answer');
  const v=s.pred==null?'':s.pred===e.predict.ok?'Болжамың дұрыс шықты!':'Есеп болжамыңды жоққа шығарды. Ғылымда осылай болады: есептеп көрмей, сенуге болмайды.';
  a.innerHTML=`Жауабы: ${e.answer}${v?`<span class="verdict">${v}</span>`:''}<div class="tools" style="margin-top:10px"><button class="btn primary" type="button" id="btnTwist">Түйінді көру ▸</button></div>`;
  a.hidden=false;
  [...$('eps').children][epi].classList.add('done');
  if(cur===iStop())$('btnNext').textContent='Түйінді көру ▸';
  [...$('dots').children].forEach(d=>d.classList.remove('lock'));
  if(fresh){sfx.win();a.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
$('task').addEventListener('input',e=>{const m=/^q(\d+)_(\d+)$/.exec(e.target.id);if(m)S().vals[m[1]+'_'+m[2]]=e.target.value;});
$('task').addEventListener('click',ev=>{
  const e=EP,s=S(),t=ev.target;
  const ch=t.closest('.chip');
  if(ch){
    if(ch.classList.contains('dc')){ch.setAttribute('aria-pressed',ch.getAttribute('aria-pressed')!=='true');return;}
    const grp=[...ch.parentNode.children];grp.forEach(b=>b.setAttribute('aria-pressed',b===ch));
    if(ch.classList.contains('pr')){s.pred=+ch.dataset.i;if(s.solved)showAnswer(false);}
    else s.pick[+ch.parentNode.dataset.qc]=+ch.dataset.i;
    return;
  }
  if(t.dataset.chk==='chips'){
    const ok=[...$('chips').children].every((b,i)=>(b.getAttribute('aria-pressed')==='true')===!!e.data[i].need);
    s.chips=ok;fb(0,ok,ok?'Дұрыс! Қалғандары — артық дерек.':'Әлі дәл емес. Әр дерекке «бұл сан қай формулаға керек?» деп сұрақ қой.');ok?sfx.ok():sfx.no();return;
  }
  if(t.dataset.chk!=null){
    const i=+t.dataset.chk,q=e.qs[i];let ok;
    if(q.c)ok=s.pick[i]===q.a;
    else{ok=true;q.f.forEach((f,j)=>{const inp=$('q'+i+'_'+j),g=near(num(inp.value),f.a,f.tol);inp.classList.toggle('good',g);inp.classList.toggle('wrong',!g);if(!g)ok=false;});}
    fb(i+1,ok,ok?'Дұрыс! '+q.ok:'Әлі дәл емес. '+q.hint);
    if(ok){s.okq.add(i);sfx.ok();if(!s.solved&&s.okq.size===e.qs.length){s.solved=true;showAnswer(true);}}else{s.okq.delete(i);sfx.no();}
    return;
  }
  if(t.id==='btnSol'){const b=$('solution');b.hidden=!b.hidden;t.setAttribute('aria-expanded',!b.hidden);t.textContent=b.hidden?'Шешімін көрсету':'Шешімін жасыру';return;}
  if(t.id==='btnReset'){ST[epi]={found:s.found,pred:null,okq:new Set(),vals:{},pick:{},chips:null,solved:false,open:s.open};renderTask();[...$('eps').children][epi].classList.remove('done');show(cur,false);return;}
  if(t.id==='btnOpen'){s.open=true;show(iTwist());$('stage').scrollIntoView({behavior:'smooth',block:'nearest'});return;}
  if(t.id==='btnTwist'){show(iTwist());$('stage').scrollIntoView({behavior:'smooth',block:'nearest'});}
});

/* ================= boot ================= */
function start(d){
  d=d||{};let k=d.ep||0;const m=/^#ep-(\d)$/.exec(location.hash||'');if(m&&+m[1]>=1&&+m[1]<=EPS.length)k=+m[1]-1;
  loadEp(k);
}
const hotApi=window.claude&&window.claude.hot;
if(hotApi&&hotApi.snapshot)hotApi.snapshot(()=>({ep:epi}));
if(hotApi&&hotApi.ready)hotApi.ready(start);else start((hotApi&&hotApi.data)||{});

})();
</script>
