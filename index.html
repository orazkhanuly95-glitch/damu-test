<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563c9">
<title>DAMU тесттері</title>
<meta name="description" content="DAMU білім беру орталығы: физикадан онлайн тест">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one friendly 720px column of rounded cards. Test screen: a brand-blue top band with the timer pill,
   a colorful answer grid (green = answered), one question card with color-coded answer letters, fixed bottom navigation. */
:root{
  --bg:#f2f6fb; --card:#ffffff; --ink:#1b2a3a; --ink-2:#5a6a7c; --line:#dde5ef;
  --brand:#2563c9; --brand-soft:#e7effc; --on-brand:#ffffff;
  --bar:#2563c9; --on-bar:#ffffff; --bar-dim:rgba(255,255,255,.2); --bar-fill:#ffd166; --alarm:#e5483d; --on-alarm:#ffffff;
  --c1:#2f6fe0; --c1s:#e8f0fe; --c2:#11936b; --c2s:#e0f4ed; --c3:#c27f00; --c3s:#fdf2da;
  --c4:#d9493f; --c4s:#fde8e6; --c5:#8448d4; --c5s:#f1e8fc; --c6:#0a8a9e; --c6s:#ddf3f6; --on-c:#ffffff;
  --ok:#13875a; --ok-soft:#e1f4ea; --warn:#9f5f00; --warn-soft:#fff3d9; --warn-line:#f1cb7e; --bad:#cc3a30; --bad-soft:#fde8e6;
  --wa:#1d9a55; --on-wa:#ffffff; --scrim:rgba(20,32,50,.5);
  --shadow:0 1px 2px rgba(27,42,58,.05),0 6px 18px rgba(27,42,58,.06);
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e141d; --card:#162030; --ink:#e7edf5; --ink-2:#9db0c4; --line:#27354a;
    --brand:#6ea2ff; --brand-soft:#1a2b4a; --on-brand:#0a1220;
    --bar:#1c3463; --on-bar:#e7edf5; --bar-dim:rgba(255,255,255,.12); --bar-fill:#ffd166; --alarm:#ff7b70; --on-alarm:#2a0b08;
    --c1:#6ea2ff; --c1s:#1a2b4a; --c2:#3ccf9c; --c2s:#12332a; --c3:#f2b53d; --c3s:#372a0e;
    --c4:#ff877c; --c4s:#3d1d1b; --c5:#b38bff; --c5s:#2a1f45; --c6:#45c9dd; --c6s:#0f3139; --on-c:#0a1220;
    --ok:#46c98e; --ok-soft:#12301f; --warn:#f0b44a; --warn-soft:#33270c; --warn-line:#6b5216; --bad:#ff8a7e; --bad-soft:#3a1a18;
    --wa:#2fbf6d; --on-wa:#06140c; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0e141d; --card:#162030; --ink:#e7edf5; --ink-2:#9db0c4; --line:#27354a;
    --brand:#6ea2ff; --brand-soft:#1a2b4a; --on-brand:#0a1220;
    --bar:#1c3463; --on-bar:#e7edf5; --bar-dim:rgba(255,255,255,.12); --bar-fill:#ffd166; --alarm:#ff7b70; --on-alarm:#2a0b08;
    --c1:#6ea2ff; --c1s:#1a2b4a; --c2:#3ccf9c; --c2s:#12332a; --c3:#f2b53d; --c3s:#372a0e;
    --c4:#ff877c; --c4s:#3d1d1b; --c5:#b38bff; --c5s:#2a1f45; --c6:#45c9dd; --c6s:#0f3139; --on-c:#0a1220;
    --ok:#46c98e; --ok-soft:#12301f; --warn:#f0b44a; --warn-soft:#33270c; --warn-line:#6b5216; --bad:#ff8a7e; --bad-soft:#3a1a18;
    --wa:#2fbf6d; --on-wa:#06140c; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.25);
    color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-sans);padding-bottom:24px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.testing::before{background:var(--bar)}
h1,h2,h3,p{margin:0}
b{font-weight:600}

.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 0}
.brand{font:700 1rem/1 var(--f-sans);letter-spacing:.18em;color:var(--brand)}
.mast-r{font:600 .8rem/1 var(--f-sans);color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:7px 12px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font:600 .8rem/1.2 var(--f-sans);color:var(--brand)}
.title{font:700 1.45rem/1.3 var(--f-sans);text-wrap:balance}
.h2{font:650 1.05rem/1.3 var(--f-sans)}
.lbl{font:600 .82rem/1.2 var(--f-sans);color:var(--ink-2)}
.hint{font-size:.88rem;color:var(--ink-2)}

/* colored facts on the cover card */
.spec{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.spec>div{background:var(--cs);color:var(--c);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.spec dt{font:600 .78rem/1.2 var(--f-sans);opacity:.9}
.spec dd{margin:4px 0 0;font:700 1.4rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.spec dd small{font:600 .8rem var(--f-sans)}

.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px}
.rules li{counter-increment:r;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:.96rem;line-height:1.5}
.rules li::before{content:counter(r);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 .82rem/1 var(--f-sans);color:var(--c);background:var(--cs)}
.rules li:nth-child(1){--c:var(--c1);--cs:var(--c1s)}
.rules li:nth-child(2){--c:var(--c5);--cs:var(--c5s)}
.rules li:nth-child(3){--c:var(--c4);--cs:var(--c4s)}
.rules li:nth-child(4){--c:var(--c2);--cs:var(--c2s)}

.fields{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px}
.fields.one{grid-template-columns:minmax(0,1fr)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=text],input[type=number]{width:100%;min-width:0;font:500 1rem var(--f-sans);color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
input[type=number]{font-family:var(--f-mono)}
input[readonly]{opacity:.8}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.agree{display:flex;gap:12px;align-items:center;font-size:.96rem;cursor:pointer;padding:12px 14px;border-radius:var(--r-sm);background:var(--brand-soft)}
.agree input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--brand)}

.btn{font:600 .96rem/1.2 var(--f-sans);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r-sm);
  padding:11px 16px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--on-wa)}
.btn.big{width:100%;min-height:54px;font-size:1.02rem}
.btn.sm{min-height:42px;padding:8px 12px;font-size:.9rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,.agree input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.cheerline{text-align:center;font-weight:600;color:var(--brand)}
.note{border-radius:var(--r-sm);padding:11px 14px;font-size:.92rem;background:var(--bg)}
.note.warn{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.note.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- test screen ---------- */
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);color:var(--on-bar);box-shadow:var(--shadow)}
.tb-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.tb-who{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.tbar .brand{color:var(--on-bar)}
.who{font-size:.86rem;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sep{margin:0 6px;opacity:.5}
.timer{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bar-dim);border-radius:14px;padding:6px 14px}
.timer .tl{font:600 .62rem/1 var(--f-sans);letter-spacing:.06em;opacity:.85}
.timer .tv{font:700 1.3rem/1.05 var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{background:var(--alarm);color:var(--on-alarm)}
.prog{height:4px;background:var(--bar-dim)}
.prog i{display:block;height:100%;background:var(--bar-fill);border-radius:0 4px 4px 0;transition:width .25s}

.sheetmap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.sm-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sm-h .n{font:700 .8rem/1 var(--f-mono);color:var(--c2);background:var(--c2s);border-radius:999px;padding:5px 9px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px 4px}
.cell{font:600 .8rem/1 var(--f-mono);font-variant-numeric:tabular-nums;width:100%;max-width:40px;min-height:24px;aspect-ratio:1;justify-self:center;
  padding:0;min-width:0;cursor:pointer;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink-2)}
.cell.done{background:var(--c2s);border-color:var(--c2s);color:var(--c2)}
.cell.cur{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

.qsheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qno{font:700 .85rem/1 var(--f-sans);color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:7px 12px}
.qof{font:600 .85rem/1 var(--f-mono);color:var(--ink-2)}
.tag{margin-left:auto;font:600 .78rem/1 var(--f-sans);color:var(--c5);background:var(--c5s);border-radius:999px;padding:7px 11px}
.qtext{font:500 1.15rem/1.55 var(--f-sans);overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:500 1rem/1.45 var(--f-sans);text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;min-height:56px;
  border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background-color .15s}
.opt .bub{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 .9rem/1 var(--f-sans);color:var(--c);background:var(--cs);transition:background-color .15s,color .15s}
.opt.multi .bub{border-radius:9px}
.opt .ot{padding-top:4px;min-width:0;overflow-wrap:anywhere}
@media (hover:hover){ .opt:hover{border-color:var(--c)} }
.opt.on{border-color:var(--c);background:var(--cs)}
.opt.on .bub{background:var(--c);color:var(--on-c)}
.snav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.05);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.snav .in{max-width:688px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.spacer{height:88px}

.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.dlg{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dlg h3{font:700 1.15rem/1.3 var(--f-sans)}
.miss{display:flex;flex-wrap:wrap;gap:5px}
.miss span{font:600 .82rem/1 var(--f-mono);background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:6px 9px}

/* ---------- result ---------- */
.verdict{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 4px}
.ring{width:156px;max-width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--rc) calc(var(--p) * 1%), var(--line) 0)}
.ring-in{width:124px;aspect-ratio:1;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.score{font:700 2.1rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.score .of{font-size:1rem;color:var(--ink-2)}
.pct{font:700 .95rem/1 var(--f-mono);color:var(--rc)}
.cheer{font:650 1.08rem/1.35 var(--f-sans);color:var(--rc);text-align:center;text-wrap:balance}
.protocol{margin:0;display:flex;flex-direction:column;background:var(--bg);border-radius:var(--r-sm);padding:4px 14px}
.protocol>div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.protocol>div:last-child{border-bottom:0}
.protocol dt{font-size:.86rem;color:var(--ink-2)}
.protocol dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.protocol .m{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.state{display:inline-block;font:600 .8rem/1 var(--f-sans);border-radius:999px;padding:6px 10px}
.state.ok{color:var(--ok);background:var(--ok-soft)} .state.bad{color:var(--bad);background:var(--bad-soft)} .state.warn{color:var(--warn);background:var(--warn-soft)}
.rep{margin:0;padding:12px 14px;background:var(--bg);border:1.5px dashed var(--line);border-radius:var(--r-sm);font:500 .8rem/1.55 var(--f-mono);
  white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
body.testing,body.testing *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
sup,sub{line-height:0;font-size:.75em}
@media (max-width:420px){
  .title{font-size:1.3rem} .qtext{font-size:1.08rem} .spec dd{font-size:1.2rem}
  .fields{grid-template-columns:minmax(0,1fr) 92px} .protocol>div{grid-template-columns:96px minmax(0,1fr)} .sheet,.qsheet{padding:16px}
}
@media (max-width:360px){ .cell{font-size:.72rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- site: home, teacher monitor ---------- */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
a{color:var(--brand)}
.mast a.brand{text-decoration:none}
.wrap.wide{max-width:900px}
.hero{display:flex;flex-direction:column;gap:8px;padding:6px 2px 2px}
.title.big{font-size:clamp(1.6rem,1.2rem + 2vw,2.2rem)}
.tests{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:720px){ .tests{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tcard .trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font:600 .8rem/1 var(--f-sans);color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:7px 11px}
.ttl{font:700 1.2rem/1.3 var(--f-sans);text-wrap:balance}
.foot{text-align:center;font-size:.92rem;padding:4px 0 10px}
.narrow{max-width:460px;width:100%;margin:0 auto}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.fallback{display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font:600 .82rem/1 var(--f-sans);color:var(--ink-2);background:var(--bg);border-radius:999px;padding:8px 12px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--c4);flex:none}
.live.on i{background:var(--ok);animation:pulse 1.6s infinite}
.live.poll i{background:var(--c3)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(19,135,90,.45)}70%{box-shadow:0 0 0 8px rgba(19,135,90,0)}100%{box-shadow:0 0 0 0 rgba(19,135,90,0)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:600 .86rem/1 var(--f-sans);border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:8px 12px;cursor:pointer;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chips button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){ .mstats{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stat{background:var(--cs);color:var(--c);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat b{font:700 1.9rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;font-weight:600}
.row.tight{gap:6px} .row.tight>.btn{flex:0 0 auto}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card)}
.prow.run{border-color:var(--c1);background:var(--c1s)}
.who2{display:flex;flex-direction:column;gap:3px;min-width:0}
.who2 .nm{font-weight:600;overflow-wrap:anywhere}
.who2 .sub{font-size:.8rem;color:var(--ink-2)}
.flag{font-size:.76rem;font-weight:600;color:var(--c4)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.sc{font:700 1rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.sc.run{color:var(--c1)}
.state.run{color:var(--c1);background:var(--c1s)}
.empty{padding:18px;text-align:center;color:var(--ink-2);background:var(--bg);border-radius:var(--r-sm);font-size:.92rem}
.linkrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linkrow .lk{font-weight:600;min-width:110px}
.linkrow code{flex:1 1 200px;min-width:0;font:500 .78rem/1.4 var(--f-mono);background:var(--bg);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.linkrow .btn{flex:0 0 auto}
.muted{color:var(--ink-2);font-weight:500}
</style>
</head>
<body>
<noscript><div class="wrap"><div class="note bad">Тест JavaScript-сіз ашылмайды. Браузер баптауынан қосыңыз.</div></div></noscript>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

/* DAMU тесттері: басты бет (#), тест (#termo, #vektor), мұғалім беті (#mugalim).

const $ = (s, r) => (r || document).querySelector(s);

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmt(s){
  let h = esc(s);
  h = h.replace(/\^(\{[^}]*\}|[+\-−]?(?:\d+|[A-Za-zα-ωΑ-Ω]))/g, (m,a) => '<sup>' + (a[0] === '{' ? a.slice(1,-1) : a) + '</sup>');
  h = h.replace(/_(\{[^}]*\}|\d+|[A-Za-zα-ωΑ-ΩА-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі])/g, (m,a) => '<sub>' + (a[0] === '{' ? a.slice(1,-1) : a) + '</sub>');
  return h;
}
function cyrb53(str, seed){
  let h1 = 0xdeadbeef ^ (seed||0), h2 = 0x41c6ce57 ^ (seed||0);
  for (let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function oh(salt, t){ return cyrb53(salt + '|' + t).toString(36); }

let toastT = 0;
function toast(msg){ const t = $('#toast'); if (!t) return; t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function copyText(text, okMsg){
  const done = () => toast(okMsg || 'Көшірілді');
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.focus(); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Көшіру мүмкін болмады. Мәтінді қолмен таңдаңыз.'); } ta.remove();
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback(); } catch(e){ fallback(); }
}
function clean(s){ return String(s || '').replace(/[|\n\r]/g, ' ').replace(/\s+/g, ' ').trim(); }
function machineLine(id, name, num, vn, score, total, status, secs){
  return '#DAMU|' + [id, clean(name), clean(num), vn, score, total, status, secs, new Date().toISOString()].join('|');
}
function splitTitle(t){ const m = String(t).match(/^(.*?)\s*\(\s*(§[^)]*)\)\s*$/); return m ? [m[1], m[2]] : [String(t), '']; }
function dur(secs){ secs = Math.max(0, secs | 0); return Math.floor(secs / 60) + ' мин ' + String(secs % 60).padStart(2, '0') + ' с'; }
function fmtTime(ms){ ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function idbOpen(){ return new Promise((res, rej) => { try { const q = indexedDB.open('damu', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); } catch(e){ rej(e); } }); }
function idbGet(k){ return withTimeout(idbOpen().then(db => new Promise((res, rej) => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result || null); t.onerror = () => rej(t.error); })).catch(() => null), 800); }
function idbPut(k, v){ idbOpen().then(db => { try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch(e){} }).catch(() => {}); }
const LOCK = {
  key(){ return 'damu_lock_' + S.cfg.id; },
  ck(){ return 'damu_l_' + S.cfg.id; },
  ok(r){ return r && typeof r === 'object' && typeof r.st === 'string' ? r : null; },
  readSync(){
    let r = this.ok(store.get(this.key(), null));
    if (!r){ try { const m = document.cookie.match(new RegExp('(?:^|; )' + this.ck() + '=([^;]*)')); if (m) r = this.ok(JSON.parse(decodeURIComponent(m[1]))); } catch(e){} }
    return r;
  },
  read(){ const r = this.readSync(); return r ? Promise.resolve(r) : idbGet(this.key()).then(x => this.ok(x)); },
  write(r){
    store.set(this.key(), r);
    try { document.cookie = this.ck() + '=' + encodeURIComponent(JSON.stringify(r)) + ';max-age=31536000;path=/;SameSite=None;Secure'; } catch(e){}
    idbPut(this.key(), r);
  }
};

  document.body.classList.remove('testing');
  const rows = candidateRows(r);
  rows.push(['Күйі', st === 'TIME' ? '<span class="state warn">Уақыт бітті</span>' : '<span class="state ok">Аяқталды</span>']);
  $('#app').innerHTML = '<main class="wrap">' + mast() + '<section class="sheet"><p class="eyebrow">Сіздің нәтижеңіз</p><h1 class="title">' + esc(tp[0]) + '</h1>' + againNote() +
    (c.show ? ring(r.score, total, pct, pct >= 80 ? 'var(--ok)' : pct >= 50 ? 'var(--c3)' : 'var(--c4)', cheer(pct))
            : '<div class="note">Жауаптарыңыз қабылданды. Нәтижені мұғалім хабарлайды.</div>') +
    protocol(rows) + '</section>' + sendBlock(st, r) + '<p class="foot"><a href="#">← Басты бет</a></p></main>';
  bindShare(st, r);
  window.scrollTo(0, 0);
}
function leftView(why){
  const c = S.cfg, r = S.rec || {}, tp = splitTitle(c.title);
  const total = r.total || (S.order && S.order.length) || c.vs[0].length;
  document.body.classList.remove('testing');
  const rows = candidateRows(r);
  rows.push(['Күйі', '<span class="state bad">Ереже бұзылды</span>']);
  rows.push(['Себебі', esc(WHY[why] || '—')]);
  $('#app').innerHTML = '<main class="wrap">' + mast() + '<section class="sheet"><p class="eyebrow">Сіздің нәтижеңіз</p><h1 class="title">' + esc(tp[0]) + '</h1>' + againNote() +
    ring(0, total, 0, 'var(--bad)', 'Тест ережесі бұзылды') +
    '<div class="note bad"><b>Тест беті тастап кетілді, сондықтан нәтиже 0.</b> Тестті қайта тапсыруға болмайды.</div>' +
    protocol(rows) + '</section>' + sendBlock('LEFT', r) + '<p class="foot"><a href="#">← Басты бет</a></p></main>';
  bindShare('LEFT', r);
  window.scrollTo(0, 0);
}


/* =====================================================================
   SITE: live results, home page, teacher monitor, router
   ===================================================================== */
function out(k, v){ $$('[data-o="' + k + '"]').forEach(e => { if (e.textContent !== v) e.textContent = v; }); }
const DEV = (() => { let d = store.get('damu_dev', ''); if (!d){ d = Math.random().toString(36).slice(2, 10); store.set('damu_dev', d); } return d; })();
function evPayload(ev, r){
  const c = S.cfg;
  return { v: 1, t: S.tid, id: c.id, ev: ev, name: clean(S.name), num: S.num || '', vn: (r.vi != null ? r.vi : S.vi) + 1,
    score: ev === 'START' || ev === 'LEFT' ? 0 : (r.score || 0), total: r.total || (S.order && S.order.length) || c.vs[0].length,
    secs: r.secs || 0, why: r.why || '', min: c.min, t0: r.t0 || S.t0 || 0, at: Date.now(), dev: DEV };
}
/* POST one event to the live channel; a beacon survives the page going away */
function live(ev, r, beacon){
  if (!S || S.cfg.pv) return Promise.resolve(false);
  const body = JSON.stringify(evPayload(ev, r || S.rec || {})), url = LIVE.url + LIVE.topic;
  if (beacon && navigator.sendBeacon){ try { if (navigator.sendBeacon(url, new Blob([body], { type: 'text/plain' }))) return Promise.resolve(true); } catch(e){} }
  const once = () => fetch(url, { method: 'POST', body: body, keepalive: true }).then(x => x.ok).catch(() => false);
  const wait = ms => new Promise(res => setTimeout(res, ms));
  return once().then(ok => ok || wait(1500).then(once)).then(ok => ok || wait(4000).then(once));
}
/* final result: send, remember that it went through, show the state */
function report(ev, r, beacon){
  S.sendState = 'pending'; paintSend();
  return live(ev, r, beacon).then(ok => {
    S.sendState = ok ? 'ok' : 'fail';
    if (ok && S.rec){ S.rec = Object.assign({}, S.rec, { sent: true }); store.set(recKey(), S.rec); LOCK.write(S.rec); }
    paintSend();
  });
}
function sendNote(){
  if (S.sendState === 'ok') return '<div class="note ok"><b>Нәтиже мұғалімге жіберілді.</b> Бетті жабуға болады.</div>';
  if (S.sendState === 'fail') return '<div class="note warn"><b>Нәтиже автоматты түрде жіберілмеді.</b> Интернетті тексеріп, «Қайта жіберу» батырмасын басыңыз немесе WhatsApp арқылы жіберіңіз.</div>';
  return '<div class="note">Нәтиже мұғалімге жіберіліп жатыр…</div>';
}
function paintSend(){
  const el = $('#sendst'); if (el) el.innerHTML = sendNote();
  const fb = $('#fallback'); if (fb) fb.hidden = S.sendState !== 'fail';
}
function finalEv(r){ return r.st === 'left' ? 'LEFT' : r.end === 'TIME' ? 'TIME' : 'DONE'; }

/* ---------- home ---------- */
function lockFor(id){ const k = 'damu_lock_' + TESTS[id].p[1]; const r = store.get(k, null); return r && typeof r === 'object' && r.st ? r : null; }
function homeView(){
  S = null; document.title = 'DAMU тесттері'; document.body.classList.remove('testing');
  const cards = ORDER.map((id, i) => {
    const p = TESTS[id].p, tp = splitTitle(p[2]), nq = p[9][0].length, done = lockFor(id);
    return `<article class="sheet tcard">
      <div class="trow"><span class="chip">${esc(tp[1] || 'Тест')}</span>${done ? '<span class="state ok">Тапсырылды</span>' : ''}</div>
      <h2 class="ttl">${esc(tp[0])}</h2>
      <dl class="spec">
        <div style="--c:var(--c1);--cs:var(--c1s)"><dt>Сұрақ</dt><dd>${nq}</dd></div>
        <div style="--c:var(--c3);--cs:var(--c3s)"><dt>Уақыт</dt><dd>${p[3]}<small> мин</small></dd></div>
        <div style="--c:var(--c2);--cs:var(--c2s)"><dt>Нұсқалар</dt><dd>${p[9].length}</dd></div>
      </dl>
      <a class="btn ${done ? '' : 'primary'} big" href="#${id}">${done ? 'Нәтижені көру' : 'Тестке кіру'}</a>
    </article>`;
  }).join('');
  $('#app').innerHTML = '<main class="wrap">' + mast() + `
    <section class="hero">
      <p class="eyebrow">DAMU білім беру орталығы · Физика</p>
      <h1 class="title big">Онлайн тест</h1>
      <p class="hint">Мұғалім берген тестті таңдаңыз. Әр тестті бір рет қана тапсыруға болады, нәтиже мұғалімге өзі жіберіледі.</p>
    </section>
    <section class="tests">${cards}</section>
    <p class="foot"><a href="#mugalim">Мұғалім беті</a></p>
  </main>`;
  window.scrollTo(0, 0);
}

/* ---------- teacher monitor ---------- */
const MON = { es: null, ev: new Map(), filter: 'all', day: 'today', conn: 'off', timer: 0, poll: 0, last: 0, clearArm: false };
function sget(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function sset(k, v){ try { sessionStorage.setItem(k, v); } catch(e){} }
function pinView(){
  document.title = 'Мұғалім беті · DAMU';
  $('#app').innerHTML = '<main class="wrap">' + mast() + `
    <section class="sheet narrow">
      <p class="eyebrow">Мұғалім беті</p>
      <h1 class="title">PIN-кодты енгізіңіз</h1>
      <form id="pinf" class="fields one" autocomplete="off">
        <div class="field"><label class="lbl" for="pin">PIN-код</label><input type="number" id="pin" inputmode="numeric" placeholder="••••••"></div>
        <div id="pinerr"></div>
        <button class="btn primary big" type="submit">Кіру</button>
      </form>
      <p class="hint"><a href="#">← Басты бет</a></p>
    </section></main>`;
  $('#pinf').onsubmit = e => {
    e.preventDefault();
    const v = String($('#pin').value || '').trim();
    if (cyrb53('damu|' + v).toString(36) === PIN_HASH){ sset('damu_pin', '1'); monitorView(); }
    else $('#pinerr').innerHTML = '<div class="note bad">PIN-код қате. Қайта жазып көріңіз.</div>';
  };
  setTimeout(() => { const i = $('#pin'); if (i) i.focus(); }, 50);
}
function monitorView(){
  if (sget('damu_pin') !== '1') return pinView();
  document.title = 'Мұғалім беті · DAMU';
  const base = baseUrl();
  $('#app').innerHTML = '<main class="wrap wide">' + mast() + `
    <section class="sheet">
      <div class="mhead"><div><p class="eyebrow">Мұғалім беті</p><h1 class="title">Тест барысы</h1></div><span class="live" id="conn"><i></i><span>Қосылуда…</span></span></div>
      <div class="chips" id="flt">
        <button data-f="all" aria-pressed="true">Барлық тест</button>${ORDER.map(id => '<button data-f="' + id + '" aria-pressed="false">' + esc(TESTS[id].short) + '</button>').join('')}
      </div>
      <div class="chips" id="day"><button data-d="today" aria-pressed="true">Бүгін</button><button data-d="all" aria-pressed="false">Барлығы</button></div>
      <div class="mstats">
        <div class="stat" style="--c:var(--c1);--cs:var(--c1s)"><b data-o="m_in">0</b><span>қазір тестте</span></div>
        <div class="stat" style="--c:var(--c2);--cs:var(--c2s)"><b data-o="m_done">0</b><span>аяқтады</span></div>
        <div class="stat" style="--c:var(--c4);--cs:var(--c4s)"><b data-o="m_left">0</b><span>беттен шықты</span></div>
        <div class="stat" style="--c:var(--c5);--cs:var(--c5s)"><b data-o="m_avg">—</b><span>орташа балл</span></div>
      </div>
    </section>
    <section class="sheet">
      <div class="mhead"><h2 class="h2">Оқушылар</h2><div class="row tight"><button class="btn sm" id="m_copy">Excel-ге көшіру</button><button class="btn sm" id="m_clear">Тарихты тазалау</button></div></div>
      <div class="plist" id="plist"></div>
    </section>
    <section class="sheet">
      <h2 class="h2">Оқушыларға сілтеме</h2>
      ${ORDER.map(id => '<div class="linkrow"><span class="lk">' + esc(TESTS[id].short) + '</span><code>' + esc(base + '#' + id) + '</code><button class="btn sm" data-copy="' + esc(base + '#' + id) + '">Көшіру</button></div>').join('')}
      <p class="hint">Хабарламалар ntfy.sh тегін сервисі арқылы келеді, сервис оларды шамамен 12 сағат сақтайды. Бұл беттің өзі алған нәтижелерді осы құрылғыда сақтайды.</p>
    </section></main>`;
  $$('#flt button').forEach(b => b.onclick = () => { MON.filter = b.dataset.f; $$('#flt button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderMon(); });
  $$('#day button').forEach(b => b.onclick = () => { MON.day = b.dataset.d; $$('#day button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderMon(); });
  $$('[data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy, 'Сілтеме көшірілді'));
  $('#m_copy').onclick = () => copyText(monTSV(), 'Кесте көшірілді. Excel-ге қойыңыз.');
  $('#m_clear').onclick = () => {
    const b = $('#m_clear');
    if (!MON.clearArm){ MON.clearArm = true; b.textContent = 'Растау: тазалау'; setTimeout(() => { MON.clearArm = false; if (b.isConnected) b.textContent = 'Тарихты тазалау'; }, 4000); return; }
    MON.clearArm = false; MON.cleared = Date.now(); store.set('damu_mon_cleared', MON.cleared); MON.ev.clear(); saveMon(); renderMon(); b.textContent = 'Тарихты тазалау';
  };
  loadMon(); connectLive(); renderMon();
  clearInterval(MON.timer); MON.timer = setInterval(renderMon, 2000);
}
function loadMon(){
  MON.cleared = store.get('damu_mon_cleared', 0);
  const arr = store.get('damu_mon', []);
  if (Array.isArray(arr)) arr.forEach(x => { if (x && x.id && x.d && x.time * 1000 > MON.cleared) MON.ev.set(x.id, x); });
}
function saveMon(){ const arr = [...MON.ev.values()].sort((a, b) => a.time - b.time).slice(-3000); store.set('damu_mon', arr); }
let saveT = 0;
function ingest(m){
  if (!m || m.event !== 'message' || !m.id || MON.ev.has(m.id)) return;
  if (m.time * 1000 <= (MON.cleared || 0)) return;
  let d; try { d = JSON.parse(m.message); } catch(e){ return; }
  if (!d || d.v !== 1 || !TESTS[d.t] || typeof d.name !== 'string') return;
  MON.ev.set(m.id, { id: m.id, time: m.time, d: d }); MON.last = Math.max(MON.last, m.time);
  clearTimeout(saveT); saveT = setTimeout(saveMon, 400);
  clearTimeout(MON.rt); MON.rt = setTimeout(renderMon, 120);
}
function setConn(s){
  MON.conn = s; const el = $('#conn'); if (!el) return;
  el.className = 'live' + (s === 'on' ? ' on' : s === 'poll' ? ' poll' : '');
  el.lastChild.textContent = s === 'on' ? 'Тікелей байланыс' : s === 'poll' ? 'Әр 15 секунд сайын жаңарады' : 'Байланыс жоқ, қайта қосылуда…';
}
function pollOnce(){
  const since = MON.last ? MON.last : 'all';
  return fetch(LIVE.url + LIVE.topic + '/json?poll=1&since=' + since).then(r => r.ok ? r.text() : '').then(t => {
    t.split('\n').forEach(line => { if (!line.trim()) return; try { ingest(JSON.parse(line)); } catch(e){} });
    if (MON.conn !== 'on') setConn('poll');
  }).catch(() => { if (MON.conn !== 'on') setConn('off'); });
}
function connectLive(){
  if (MON.es){ try { MON.es.close(); } catch(e){} MON.es = null; }
  clearInterval(MON.poll);
  pollOnce();
  if (window.EventSource){
    try {
      MON.es = new EventSource(LIVE.url + LIVE.topic + '/sse?since=' + (MON.last || 'all'));
      MON.es.onopen = () => setConn('on');
      MON.es.onerror = () => { if (MON.conn === 'on') setConn('off'); };
      MON.es.onmessage = e => { try { ingest(JSON.parse(e.data)); } catch(x){} };
    } catch(e){ MON.es = null; }
  }
  MON.poll = setInterval(() => { if (MON.conn !== 'on') pollOnce(); }, 15000);
}
function stopMon(){ clearInterval(MON.timer); clearInterval(MON.poll); if (MON.es){ try { MON.es.close(); } catch(e){} MON.es = null; } }
function monRows(){
  const now = Date.now(), d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const map = new Map();
  [...MON.ev.values()].sort((a, b) => a.time - b.time).forEach(x => {
    const d = x.d, t = x.time * 1000;
    if (MON.filter !== 'all' && d.t !== MON.filter) return;
    if (MON.day === 'today' && t < d0.getTime()) return;
    const key = d.t + '|' + clean(d.name).toLowerCase() + '|' + (d.num || '');
    let s = map.get(key);
    if (!s){ s = { t: d.t, name: clean(d.name), num: d.num || '', vn: d.vn, total: d.total, min: d.min || 30, devs: new Set(), starts: 0, start: 0, fin: null }; map.set(key, s); }
    s.devs.add(d.dev);
    if (d.ev === 'START'){ s.starts++; if (!s.start) s.start = d.t0 || t; s.vn = d.vn; s.total = d.total; }
    else if (!s.fin){ s.fin = d; s.vn = d.vn; s.total = d.total; if (!s.start) s.start = d.t0 || t; }
  });
  return [...map.values()].map(s => {
    let st, cls, score = null, rank;
    if (s.fin){
      if (s.fin.ev === 'LEFT'){ st = 'Беттен шықты'; cls = 'bad'; score = 0; rank = 3; }
      else { st = s.fin.ev === 'TIME' ? 'Уақыт бітті' : 'Аяқтады'; cls = s.fin.ev === 'TIME' ? 'warn' : 'ok'; score = s.fin.score; rank = 2; }
    } else if (now - s.start < (s.min + 2) * 60000){ st = 'Тестте'; cls = 'run'; rank = 1; }
    else { st = 'Аяқтамады'; cls = 'bad'; score = 0; rank = 4; }
    return Object.assign(s, { st: st, cls: cls, score: score, rank: rank, secs: s.fin ? s.fin.secs : Math.round((now - s.start) / 1000), why: s.fin && s.fin.why });
  }).sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name, 'kk'));
}
function hhmm(ms){ const d = new Date(ms), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()); }
function renderMon(){
  const list = $('#plist'); if (!list) return;
  const rows = monRows();
  const inT = rows.filter(r => r.cls === 'run').length, fin = rows.filter(r => r.rank === 2), left = rows.filter(r => r.rank >= 3).length;
  const avg = fin.length ? Math.round(fin.reduce((a, r) => a + (r.total ? r.score / r.total * 100 : 0), 0) / fin.length) + '%' : '—';
  out('m_in', String(inT)); out('m_done', String(fin.length)); out('m_left', String(left)); out('m_avg', avg);
  if (!rows.length){ list.innerHTML = '<div class="empty">Әзірге ешкім тест бастаған жоқ. Оқушы тестті бастаған сәтте ол осы жерде пайда болады.</div>'; return; }
  list.innerHTML = rows.map(r => {
    const multi = r.devs.size > 1 || r.starts > 1;
    const right = r.cls === 'run' ? '<span class="sc run">' + Math.floor(r.secs / 60) + ':' + String(r.secs % 60).padStart(2, '0') + '</span>'
      : '<span class="sc">' + (r.score != null ? r.score + ' / ' + r.total : '') + '</span>';
    return '<div class="prow ' + r.cls + '"><div class="who2"><span class="nm">' + esc(r.name) + (r.num ? ' <span class="muted">№' + esc(r.num) + '</span>' : '') + '</span>' +
      '<span class="sub">' + esc(TESTS[r.t].short) + ' · ' + r.vn + '-нұсқа · ' + hhmm(r.start) + (r.why && r.rank === 3 ? ' · ' + esc(WHY[r.why] || '') : '') + '</span>' +
      (multi ? '<span class="flag">Бірнеше рет немесе басқа құрылғыдан ашқан</span>' : '') + '</div>' +
      '<div class="rt"><span class="state ' + (r.cls === 'run' ? 'run' : r.cls) + '">' + r.st + '</span>' + right + '</div></div>';
  }).join('');
}
function monTSV(){
  const head = ['Аты-жөні', 'Журнал №', 'Тест', 'Нұсқа', 'Балл', 'Барлығы', '%', 'Күйі', 'Басталды', 'Уақыты (мин)'];
  const rows = monRows().map(r => [r.name, r.num, TESTS[r.t].short, r.vn, r.score == null ? '' : r.score, r.total, r.score == null || !r.total ? '' : Math.round(r.score / r.total * 100), r.st, hhmm(r.start), (r.secs / 60).toFixed(1).replace('.', ',')]);
  return [head].concat(rows).map(r => r.join('\t')).join('\n');
}

/* ---------- router ---------- */
function route(){
  if (G.on) return;                       // a running test is never navigated away from here
  const h = (location.hash || '').slice(1);
  if (h !== 'mugalim') stopMon();
  if (TESTS[h]){ studentBoot(TESTS[h].p, h); window.scrollTo(0, 0); return; }
  if (h === 'mugalim') return monitorView();
  homeView();
}
window.addEventListener('hashchange', route);
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', route); else route();
</script>
