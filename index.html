/* ---------- results to the teacher's page ---------- */
function ubtPayload(ev, id, r){
  const d = UBT[id];
  return { v: 1, t: id, id: d.id, ev: ev, name: clean(r.name), num: '', vn: 1, score: ev === 'DONE' ? r.score : 0, total: ubtMax(d),
    secs: ev === 'DONE' ? r.secs : 0, why: '', min: d.min, t0: r.t0, sess: '', kl: r.kl || '', at: Date.now(), dev: DEV, cam: '', warn: 0, wk: '',
    ubt: ev === 'DONE' ? r.pts : '' };
}
function ubtSend(ev){
  const id = U.id, r = U.rec; if (!id || !r) return Promise.resolve(false);
  const body = JSON.stringify(ubtPayload(ev, id, r)), url = LIVE.url + LIVE.topic;
  const once = () => fetch(url, { method: 'POST', body: body, keepalive: true }).then(x => x.ok).catch(() => false);
  const wait = ms => new Promise(res => setTimeout(res, ms));
  const go = once().then(ok => ok || wait(1500).then(once)).then(ok => ok || wait(4000).then(once));
  if (ev !== 'DONE') return go;
  if (U.id === id) { U.sendState = 'pending'; ubtPaintSend(); }
  return go.then(ok => {
    if (ok){ r.sent = true; ubtSave(id, r); }
    if (U.id === id && U.rec === r){ U.sendState = ok ? 'ok' : 'fail'; ubtPaintSend(); }
    return ok;
  });
}
function ubtSendNote(){
  if (U.sendState === 'ok') return '<div class="note ok"><b>Нәтиже мұғалімге жіберілді.</b></div>';
  if (U.sendState === 'fail') return '<div class="note warn"><b>Нәтиже автоматты түрде жіберілмеді.</b> Интернетті тексеріп, «Қайта жіберу» батырмасын басыңыз немесе WhatsApp арқылы жіберіңіз.</div>';
  return '<div class="note">Нәтиже мұғалімге жіберіліп жатыр…</div>';
}
function ubtPaintSend(){ const el = $('#u_sendst'); if (el) el.innerHTML = ubtSendNote(); const fb = $('#u_fb'); if (fb) fb.hidden = U.sendState !== 'fail'; }
function ubtText(){
  const d = U.d, r = U.rec, max = ubtMax(d);
  return ['✔ ҰБТ · ' + d.title, 'Оқушы: ' + clean(r.name), 'Балл: ' + r.score + ' / ' + max + ' (' + Math.round(r.score / max * 100) + '%)',
    ubtPartsSums(d, String(r.pts).split('')).map(x => x.p.n + ' бөлім: ' + x.got + '/' + x.max).join(' · '), ubtWeakLine(d, String(r.pts).split('').map(Number)), 'Уақыты: ' + dur(r.secs)].join('\n');

/* ---------- statistics by section and topic ----------
   got[k] / max[k]: points for task k+1 (one student, or summed over a class).
   Percent by points, so matching and multi-answer tasks (2 points) weigh twice. */
function ubtTaskMax(d){ return d.q.map(q => ubtPartOf(d, q.n).pts); }
function ubtTopicStats(d, got, max){
  return (d.topics || []).map(sec => {
    const t = sec.t.map(tp => { let g = 0, m = 0; tp.q.forEach(n => { g += got[n - 1] || 0; m += max[n - 1] || 0; }); return { n: tp.n, sec: sec.n, q: tp.q, got: g, max: m, pct: m ? Math.round(g / m * 100) : 0 }; });
    const g = t.reduce((a, x) => a + x.got, 0), m = t.reduce((a, x) => a + x.max, 0);
    return { n: sec.n, t: t, got: g, max: m, pct: m ? Math.round(g / m * 100) : 0 };
  });
}
function ubtLvl(p){ return p >= 80 ? 'ok' : p >= 50 ? 'mid' : 'low'; }
const UBT_LVL = { ok: 'Жақсы меңгерілген', mid: 'Пысықтау керек', low: 'Қайталау керек' };
function ubtWeak(st){
  const all = []; st.forEach(s => s.t.forEach(t => all.push(t)));
  const by = (a, b) => a.pct - b.pct || b.max - a.max;
  return { secs: st.filter(s => s.pct < 80).sort(by), low: all.filter(t => t.pct < 50).sort(by), mid: all.filter(t => t.pct >= 50 && t.pct < 80).sort(by) };
}
/* sections → topics with bars; chip(n) draws a task number */
function ubtStatsBody(st, chip, who){
  const w = ubtWeak(st), bar = p => '<span class="ust-bar ' + ubtLvl(p) + '" aria-hidden="true"><i style="width:' + Math.max(p, 2) + '%"></i></span>';
  const list = w.low.length ? w.low : w.mid;
  const todo = !w.secs.length ? '<div class="note ok"><b>Барлық бөлімнен 80%-дан жоғары!</b> Қайталауды қажет ететін бөлім жоқ.</div>'
    : '<div class="ust-todo' + (w.low.length || w.secs.some(x => x.pct < 50) ? '' : ' mid') + '"><p class="ust-h">' + (who === 'class' ? 'Сыныппен қайталау керек бөлімдер' : 'Қайталау керек бөлімдер') + '</p><div class="ust-secs">' +
      w.secs.map(s => '<span class="ust-sec ' + ubtLvl(s.pct) + '">' + esc(s.n) + ' <b>' + s.pct + '%</b></span>').join('') + '</div>' +
      (list.length ? '<p class="ust-h">' + (w.low.length ? 'Ең әлсіз тақырыптар' : 'Пысықтау керек тақырыптар') + '</p><ol class="ust-weak">' +
        list.map(t => '<li><span class="uw-n"><b>' + esc(t.n) + '</b><small>' + esc(t.sec) + ' · ' + (t.q.length > 1 ? 'тапсырмалар ' : 'тапсырма ') + t.q.join(', ') + '</small></span><b class="uw-p ' + ubtLvl(t.pct) + '">' + t.pct + '%</b></li>').join('') + '</ol>' : '') + '</div>';
  const secs = st.map(s => '<div class="usec"><div class="usec-h"><span class="usec-n">' + esc(s.n) + '</span><span class="ulev ' + ubtLvl(s.pct) + '">' + UBT_LVL[ubtLvl(s.pct)] + '</span><b class="usec-p ' + ubtLvl(s.pct) + '">' + s.pct + '%</b></div>' + bar(s.pct) +
    '<ul class="utop">' + s.t.map(t => '<li><span class="ut-n">' + esc(t.n) + '<span class="ut-q">' + t.q.map(chip).join('') + '</span></span><span class="ut-v"><b class="' + ubtLvl(t.pct) + '">' + t.pct + '%</b><small>' + t.got + '/' + t.max + ' балл</small></span></li>').join('') + '</ul></div>').join('');

function ubtStats(){
  const d = U.d, r = U.rec, pts = String(r.pts).split('').map(Number), mx = ubtTaskMax(d), st = ubtTopicStats(d, pts, mx);
  const chip = n => { const g = pts[n - 1], m = mx[n - 1];

/* teacher page: the class summary of every ҰБТ test among the rows on screen */
function ubtMonStats(rows){
  const box = $('#ubtstat'); if (!box) return;
  const html = UBT_ORDER.map(id => {
    const d = UBT[id], rs = rows.filter(r => r.t === id && r.fin && r.fin.ev === 'DONE' && String(r.fin.ubt || '').length === d.q.length);

function ubtCheer(p){

  if (p >= 50) return 'Жаман емес. Төмендегі шешімдерді қарап, қайталаңыз.';

function ubtCard(d, q, a, got){

  const tag = got === max ? '<span class="rv-tag okk">Дұрыс · ' + got + ' балл</span>' : none ? '<span class="rv-tag none">Жауапсыз · 0 / ' + max + '</span>'
    : '<span class="rv-tag' + (got ? ' part' : '') + '">' + (got ? 'Жартылай' : 'Қате') + ' · ' + got + ' / ' + max + ' балл</span>';
  const ctx = q.c && d.ctx[q.c] ? '<p class="hint">«' + esc(d.ctx[q.c].title) + '» мәтіні бойынша (' + ubtPartOf(d, q.n).from + '–' + ubtPartOf(d, q.n).to + ')</p>' : '';
  const rows = q.t === 'match' ? '<ol class="umrows sm">' + q.r.map((t, k) => '<li><span class="uml">' + 'AB'[k] + '</span><span>' + t + '</span></li>').join('') + '</ol>' : '';
  return '<article class="rv' + (got === max ? ' good' : '') + '" id="rv-' + q.n + '"><div class="rv-h"><span class="rv-no">' + q.n + '-тапсырма</span>' + tag + '</div>' + ctx +
    '<div class="rv-q">' + q.q + '</div>' + uFig(q.fig, q.fig && q.fig.w > 900) + (q.qa ? '<div class="rv-q">' + q.qa + '</div>' : '') + rows +
    (got === max ? '' : uAnsHtml(d, q, a, none ? 'none' : 'bad', 'Сіздің жауабыңыз')) + uAnsHtml(d, q, R, 'ok', 'Дұрыс жауап') +
    uSolHtml(q, nt, R) + '</article>';
}
/* the worked solution: Берілгені (and ХБЖ) | Табу керек, then the steps, then the answer from the key */
function uSolHtml(q, nt, R){
  if (!nt) return '';
  const li = a => '<ul>' + a.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  const ans = q.t === 'match' ? [0, 1].map(rw => 'AB'[rw] + ' → ' + q.o[R[rw]]).join('; ') : R.map(k => LET[k] + ') ' + q.o[k]).join('; ');

    (nt.si ? '<div class="us-si"><span class="us-h">ХБЖ-да:</span>' + li(nt.si) + '</div>' : '') + '</div>' : '';
  return '<div class="rv-sol usol"><span class="lbl">Шығарылу жолы</span>' + given +
    '<span class="us-h">' + (nt.g ? 'Шешуі:' : 'Түсіндірме:') + '</span><ol>' + nt.s.map(x => '<li>' + x + '</li>').join('') + '</ol>' +
    '<div class="us-ans"><b>Жауабы:</b> ' + ans + '</div></div>';
}

/* =====================================================================
   CALCULATOR: digits, comma, + − × ÷, √, ⌫, C, =.  × and ÷ go before + and −.
   √ applies to the number after it; pressed on a typed number it takes that number,
   pressed right after «=» it takes the result.
   ===================================================================== */
const CALC = { tk: [], fresh: false, err: false, hist: '', open: false, el: null };
const CALC_KEYS = [['C', 'c', 'fn'], ['⌫', 'bs', 'fn'], ['√', 'sqrt', 'op'], ['÷', '÷', 'op'], ['7', '7'], ['8', '8'], ['9', '9'], ['×', '×', 'op'], ['4', '4'], ['5', '5'], ['6', '6'], ['−', '−', 'op'],
  ['1', '1'], ['2', '2'], ['3', '3'], ['+', '+', 'op'], ['0', '0', 'wide'], [',', ','], ['=', '=', 'eq']];
const CALC_NAME = { c: 'Тазалау', bs: 'Соңғысын өшіру', sqrt: 'Түбір', '÷': 'Бөлу', '×': 'Көбейту', '−': 'Азайту', '+': 'Қосу', '=': 'Нәтиже', ',': 'Үтір' };
function calcEl(){
  if (CALC.el && CALC.el.isConnected) return CALC.el;
  const el = document.createElement('section'); el.id = 'ucalc'; el.className = 'ucalc'; el.hidden = true; el.setAttribute('aria-label', 'Калькулятор');
  el.innerHTML = '<div class="uc-d"><button class="uc-x" data-c="close" aria-label="Калькуляторды жабу">×</button><div class="uc-e" id="uc_e"></div>' +
    '<div class="uc-v" id="uc_v" aria-live="polite">0</div></div>' +
    '<div class="uc-k">' + CALC_KEYS.map(k => '<button class="uk' + (k[2] ? ' ' + k[2] : '') + '" data-c="' + k[1] + '"' + (CALC_NAME[k[1]] ? ' aria-label="' + CALC_NAME[k[1]] + '"' : '') + '>' + k[0] + '</button>').join('') + '</div>';
  el.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b){ e.preventDefault(); calcKey(b.dataset.c); } });
  document.body.appendChild(el); CALC.el = el; return el;
}
function calcToggle(on){
  if (on === undefined) on = !CALC.open;
  if (on && !(U.rec && U.rec.st === 'started' && $('.ubar'))) on = false;
  CALC.open = on;
  if (on){ calcEl().hidden = false; calcPaint(); } else if (CALC.el) CALC.el.hidden = true;
  const b = $('#u_calc'); if (b) b.setAttribute('aria-pressed', String(on));
  calcPad();
}
function calcPad(){
  const sp = $('.ubar') ? $('.spacer') : null;
  document.body.classList.toggle('calc-on', CALC.open);
  if (sp) sp.style.height = CALC.open && CALC.el && window.innerWidth < 1340 ? (88 + CALC.el.offsetHeight) + 'px' : '';
}
const SUPD = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
function calcFmt(v){
  if (!isFinite(v)) return 'Қате';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e12 || a < 1e-6){
    let e = Math.floor(Math.log10(a)), m = +(v / Math.pow(10, e)).toPrecision(10);
    if (Math.abs(m) >= 10){ m = +(m / 10).toPrecision(10); e++; }
    return String(m).replace('.', ',').replace('-', '−') + '·10' + String(e).split('').map(ch => SUPD[ch]).join('');
  }
  return String(+v.toPrecision(12)).replace('.', ',').replace('-', '−');
}
function calcExpr(tk){
  return tk.map((x, i) => {
    if (x.t === 'num') return x.s;
    if (x.t === 'val') return calcFmt(x.v);
    if (x.t === 'sqrt') return '√';
    const prev = tk[i - 1];
    return x.s === '−' && (!prev || prev.t === 'op') ? '−' : ' ' + x.s + ' ';
  }).join('');
}
/* null = not finished yet; NaN = cannot be computed (÷ 0, √ of a negative number) */
function calcEval(tk){
  let i = 0;
  const atom = () => {
    const x = tk[i]; if (!x) return null;
    if (x.t === 'sqrt'){ i++; const v = atom(); return v == null ? null : v < 0 ? NaN : Math.sqrt(v); }
    if (x.t === 'op' && x.s === '−'){ i++; const v = atom(); return v == null ? null : -v; }
    if (x.t === 'num'){ i++; const v = parseFloat(x.s.replace(',', '.')); return isNaN(v) ? null : v; }
    if (x.t === 'val'){ i++; return x.v; }
    return null;
  };
  const term = () => {
    let v = atom(); if (v == null) return null;
    while (tk[i] && tk[i].t === 'op' && (tk[i].s === '×' || tk[i].s === '÷')){ const o = tk[i++].s, w = atom(); if (w == null) return null; v = o === '×' ? v * w : (w === 0 ? NaN : v / w); }
    return v;
  };
  let v = term(); if (v == null) return null;
  while (tk[i] && tk[i].t === 'op' && (tk[i].s === '+' || tk[i].s === '−')){ const o = tk[i++].s, w = term(); if (w == null) return null; v = o === '+' ? v + w : v - w; }
  return i < tk.length ? null : v;
}
function calcPreview(){
  const tk = CALC.tk.slice(); while (tk.length && (tk[tk.length - 1].t === 'op' || tk[tk.length - 1].t === 'sqrt')) tk.pop();
  if (tk.length < 2) return null;
  return calcEval(tk);
}
function calcKey(c){
  if (c === 'close') return calcToggle(false);
  let tk = CALC.tk;
  if (CALC.err){ CALC.err = false; CALC.fresh = false; tk = CALC.tk = []; if (c === 'bs' || c === 'c') return calcPaint(); }
  if (c === 'c'){ CALC.tk = []; CALC.fresh = false; CALC.hist = ''; return calcPaint(); }
  const last = tk[tk.length - 1];
  if (c === 'bs'){
    if (CALC.fresh){ CALC.tk = []; CALC.fresh = false; return calcPaint(); }
    if (last && last.t === 'num' && last.s.length > 1) last.s = last.s.slice(0, -1); else tk.pop();
    return calcPaint();
  }
  if (/^[0-9]$/.test(c) || c === ','){
    if (CALC.fresh){ tk = CALC.tk = []; CALC.fresh = false; }
    let l = tk[tk.length - 1];
    if (l && l.t === 'val'){ tk.pop(); l = null; }
    if (l && l.t === 'num'){
      if (c === ','){ if (!l.s.includes(',')) l.s += ','; }
      else if (l.s.replace(',', '').length < 15) l.s = l.s === '0' ? c : l.s + c;
    } else tk.push({ t: 'num', s: c === ',' ? '0,' : c });
    return calcPaint();
  }
  if (c === 'sqrt'){
    if (CALC.fresh && tk.length === 1 && tk[0].t === 'val'){
      const v = tk[0].v; CALC.hist = '√(' + calcFmt(v) + ') =';
      if (v < 0){ CALC.err = true; CALC.tk = []; CALC.fresh = false; } else CALC.tk = [{ t: 'val', v: Math.sqrt(v) }];
      return calcPaint();
    }
    CALC.fresh = false;
    if (last && (last.t === 'num' || last.t === 'val')) tk.splice(tk.length - 1, 0, { t: 'sqrt' }); else tk.push({ t: 'sqrt' });
    return calcPaint();
  }
  if ('+−×÷'.includes(c)){
    CALC.fresh = false;
    if (!last){ if (c === '−') tk.push({ t: 'op', s: c }); return calcPaint(); }
    if (last.t === 'sqrt') return calcPaint();
    if (last.t === 'op'){
      if (c === '−' && (last.s === '×' || last.s === '÷')){ tk.push({ t: 'op', s: c }); return calcPaint(); }
      while (tk.length && tk[tk.length - 1].t === 'op') tk.pop();
      if (tk.length && tk[tk.length - 1].t !== 'sqrt') tk.push({ t: 'op', s: c }); else if (!tk.length && c === '−') tk.push({ t: 'op', s: c });
      return calcPaint();
    }
    if (last.t === 'num' && /,$/.test(last.s)) last.s = last.s.slice(0, -1);
    tk.push({ t: 'op', s: c }); return calcPaint();
  }
  if (c === '='){
    if (CALC.fresh || !tk.length) return calcPaint();
    const v = calcEval(tk);
    if (v === null) return calcPaint(true);
    CALC.hist = calcExpr(tk) + ' =';
    if (!isFinite(v)){ CALC.err = true; CALC.tk = []; CALC.fresh = false; return calcPaint(); }
    CALC.tk = [{ t: 'val', v: v }]; CALC.fresh = true; return calcPaint();
  }
}
function calcPaint(shake){
  if (!CALC.el) return;
  const e = $('#uc_e'), v = $('#uc_v');
  const big = CALC.err ? 'Қате' : CALC.fresh ? calcFmt(CALC.tk[0].v) : (calcExpr(CALC.tk) || '0');
  v.textContent = big; v.classList.toggle('err', CALC.err);
  v.classList.toggle('long', big.length > 14); v.classList.toggle('vlong', big.length > 22);
  // the small line: the computed expression after «=», a live result while typing
  const pv = CALC.fresh || CALC.err ? null : calcPreview();
  e.textContent = CALC.fresh || CALC.err ? CALC.hist : pv == null ? '' : '= ' + calcFmt(pv);
  e.classList.toggle('live', !(CALC.fresh || CALC.err)); e.classList.toggle('err', pv != null && !isFinite(pv));
  if (shake){ v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake'); }
}
document.addEventListener('keydown', e => {
  if (!CALC.open || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const map = { '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', ':': '÷', '.': ',', ',': ',', 'Enter': '=', '=': '=', 'Backspace': 'bs', 'Delete': 'c', 'Escape': 'close', 'r': 'sqrt', 'R': 'sqrt' };
  const c = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
  if (!c) return;
  e.preventDefault(); calcKey(c);
});
window.addEventListener('resize', () => { if (CALC.open) calcPad(); });

/* =====================================================================
   MATCHING TASKS in the lesson tests (ҰБТ format)
   A bank entry with a 4th element [row A, row B] is a matching task: q[2] holds, for each row, the hash
   of 'A|' or 'B|' + the right option's text. The answer is [option for A, option for B] as shown on the
   screen (-1 = not chosen yet). Every right row gives 1 point, so the task is worth 2 points, and the
   test's total is counted in points.
   ===================================================================== */
function isMatch(q){ return !!q && Array.isArray(q[3]); }
function qMax(q){ return isMatch(q) ? q[3].length : 1; }
function vTotal(vi){ const c = S.cfg, v = c.vs[vi] || c.vs[0]; return v.reduce((a, e) => a + qMax(c.bank[e[0]]), 0); }
function ptsTotal(){ return S.order && S.order.length ? S.order.reduce((a, e) => a + qMax(S.cfg.bank[e.bi]), 0) : vTotal(S.vi || 0); }
function mRight(q, perm, salt){ return q[3].map((_, r) => perm.findIndex(oi => oh(salt, 'AB'[r] + '|' + q[1][oi]) === q[2][r])); }
function qPts(i){
  const e = S.order[i], q = S.cfg.bank[e.bi];
  if (!isMatch(q)) return isCorrect(i) ? 1 : 0;
  const a = S.ans[i] || [], R = mRight(q, e.perm, S.cfg.salt);
  return R.filter((k, r) => k >= 0 && a[r] === k).length;
}
function ansFull(k){ const a = S.ans[k] || [], q = S.cfg.bank[S.order[k].bi]; return isMatch(q) ? a.length > 0 && a.every(x => x >= 0) : a.length > 0; }
function ansCls(k){ const a = S.ans[k] || []; return ansFull(k) ? ' done' : a.some(x => x >= 0) ? ' half' : ''; }
function matchHtml(q, e, a){
  a = a || [];
  return '<div class="umt' + (umtLong(q[1]) ? ' long' : '') + '" role="group" aria-label="Сәйкестендіру">' + q[3].map((t, rw) => {
    const k = a[rw] != null && a[rw] >= 0 ? a[rw] : -1, sel = k >= 0 ? fmt(q[1][e.perm[k]]) : '';
    return '<div class="umt-r"><div class="umt-l"><span class="umt-k">' + 'AB'[rw] + ')</span><span>' + fmt(t) + '</span></div>' +
      '<div class="umt-c"><div class="udd"><button type="button" class="udd-b' + (sel ? ' set' : '') + '" data-dd="' + rw + '" aria-haspopup="listbox" aria-expanded="false" aria-label="' + 'AB'[rw] + ' үшін жауап">' +
      '<span class="udd-v">' + (sel || 'Жауапты таңдаңыз') + '</span><span class="udd-i" aria-hidden="true"></span></button>' +
      '<div class="udd-l" role="listbox" hidden>' + e.perm.map((oi, j) => '<button type="button" class="udd-o' + (k === j ? ' on' : '') + '" role="option" aria-selected="' + (k === j) + '" data-mr="' + rw + '" data-mk="' + j + '">' + fmt(q[1][oi]) + '</button>').join('') + '</div></div></div></div>';
  }).join('') + '</div><p class="hint mhint">Әр жол үшін тізімнен бір жауапты таңдаңыз. Әр дұрыс жол — 1 балл.</p>';
}
function halfNote(){
  const half = S.order.map((e, k) => isMatch(S.cfg.bank[e.bi]) && (S.ans[k] || []).length && !ansFull(k) ? k + 1 : 0).filter(Boolean);
  return half.length ? '<p class="hint">Сәйкестендіруде бір жол ғана толтырылған:</p><div class="miss">' + half.map(n => '<span>' + n + '</span>').join('') + '</div>' : '';
}
document.addEventListener('click', e => {
  if (!S || !G.on || !S.order || !S.order.length || !$('.tbar')) return;
  const dd = e.target.closest('[data-dd]');
  if (dd){ const l = dd.nextElementSibling, open = l.hidden; uddClose(); if (open) uddOpen(dd); return; }
  const mb = e.target.closest('[data-mr]');
  if (mb){
    const q = S.cfg.bank[S.order[S.cur].bi]; if (!isMatch(q)) return;
    const a = (S.ans[S.cur] && S.ans[S.cur].length ? S.ans[S.cur] : q[3].map(() => -1)).slice();
    a[+mb.dataset.mr] = +mb.dataset.mk; S.ans[S.cur] = a; testView(true); return;
  }
  if (!e.target.closest('.udd')) uddClose();
});
