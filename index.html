<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563c9">
<title>DAMU тесттері</title>
<meta name="description" content="DAMU білім беру орталығы. Физикадан онлайн тест. Мұғалім: Ысмайл Рамазан Оразханұлы">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one friendly 720px column of rounded cards. Test screen: a brand-blue top band with the timer pill,
   a colorful answer grid (green = answered), one question card with color-coded answer letters, fixed bottom navigation. */
:root{
  --bg:#f2f6fb; --card:#ffffff; --ink:#1b2a3a; --ink-2:#5a6a7c; --line:#dde5ef;
  --brand:#2563c9; --brand-soft:#e7effc; --on-brand:#ffffff;
  --bar:#2563c9; --on-bar:#ffffff; --bar-dim:rgba(255,255,255,.2); --bar-fill:#ffd166; --alarm:#e5483d; --on-alarm:#ffffff;
  --c1:#2f6fe0; --c1s:#e8f0fe; --c2:#11936b; --c2s:#e0f4ed; --c3:#c27f00; --c3s:#fdf2da;
  --c4:#d9493f; --c4s:#fde8e6; --c5:#8448d4; --c5s:#f1e8fc; --c6:#0a8a9e; --c6s:#ddf3f6; --on-c:#ffffff;
  --ok:#13875a; --ok-soft:#e1f4ea; --warn:#9f5f00; --warn-soft:#fff3d9; --warn-line:#f1cb7e; --bad:#cc3a30; --bad-soft:#fde8e6;
  --wa:#1d9a55; --on-wa:#ffffff; --scrim:rgba(20,32,50,.5);
  --shadow:0 1px 2px rgba(27,42,58,.05),0 6px 18px rgba(27,42,58,.06);
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e141d; --card:#162030; --ink:#e7edf5; --ink-2:#9db0c4; --line:#27354a;
    --brand:#6ea2ff; --brand-soft:#1a2b4a; --on-brand:#0a1220;
    --bar:#1c3463; --on-bar:#e7edf5; --bar-dim:rgba(255,255,255,.12); --bar-fill:#ffd166; --alarm:#ff7b70; --on-alarm:#2a0b08;
    --c1:#6ea2ff; --c1s:#1a2b4a; --c2:#3ccf9c; --c2s:#12332a; --c3:#f2b53d; --c3s:#372a0e;
    --c4:#ff877c; --c4s:#3d1d1b; --c5:#b38bff; --c5s:#2a1f45; --c6:#45c9dd; --c6s:#0f3139; --on-c:#0a1220;
    --ok:#46c98e; --ok-soft:#12301f; --warn:#f0b44a; --warn-soft:#33270c; --warn-line:#6b5216; --bad:#ff8a7e; --bad-soft:#3a1a18;
    --wa:#2fbf6d; --on-wa:#06140c; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0e141d; --card:#162030; --ink:#e7edf5; --ink-2:#9db0c4; --line:#27354a;
    --brand:#6ea2ff; --brand-soft:#1a2b4a; --on-brand:#0a1220;
    --bar:#1c3463; --on-bar:#e7edf5; --bar-dim:rgba(255,255,255,.12); --bar-fill:#ffd166; --alarm:#ff7b70; --on-alarm:#2a0b08;
    --c1:#6ea2ff; --c1s:#1a2b4a; --c2:#3ccf9c; --c2s:#12332a; --c3:#f2b53d; --c3s:#372a0e;
    --c4:#ff877c; --c4s:#3d1d1b; --c5:#b38bff; --c5s:#2a1f45; --c6:#45c9dd; --c6s:#0f3139; --on-c:#0a1220;
    --ok:#46c98e; --ok-soft:#12301f; --warn:#f0b44a; --warn-soft:#33270c; --warn-line:#6b5216; --bad:#ff8a7e; --bad-soft:#3a1a18;
    --wa:#2fbf6d; --on-wa:#06140c; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.25);
    color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-sans);padding-bottom:24px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.testing::before{background:var(--bar)}
h1,h2,h3,p{margin:0}
b{font-weight:600}

.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 0}
.brand{font:700 1rem/1 var(--f-sans);letter-spacing:.18em;color:var(--brand)}
.mast-r{font:600 .8rem/1 var(--f-sans);color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:7px 12px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font:600 .8rem/1.2 var(--f-sans);color:var(--brand)}
.title{font:700 1.45rem/1.3 var(--f-sans);text-wrap:balance}
.h2{font:650 1.05rem/1.3 var(--f-sans)}
.lbl{font:600 .82rem/1.2 var(--f-sans);color:var(--ink-2)}
.hint{font-size:.88rem;color:var(--ink-2)}

/* colored facts on the cover card */
.spec{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.spec>div{background:var(--cs);color:var(--c);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.spec dt{font:600 .78rem/1.2 var(--f-sans);opacity:.9}
.spec dd{margin:4px 0 0;font:700 1.4rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.spec dd small{font:600 .8rem var(--f-sans)}

.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px}
.rules li{counter-increment:r;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:.96rem;line-height:1.5}
.rules li::before{content:counter(r);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 .82rem/1 var(--f-sans);color:var(--c);background:var(--cs)}
.rules li:nth-child(1){--c:var(--c1);--cs:var(--c1s)}
.rules li:nth-child(2){--c:var(--c5);--cs:var(--c5s)}
.rules li:nth-child(3){--c:var(--c4);--cs:var(--c4s)}
.rules li:nth-child(4){--c:var(--c2);--cs:var(--c2s)}

.fields{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px}
.fields.one{grid-template-columns:minmax(0,1fr)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=text],input[type=number]{width:100%;min-width:0;font:500 1rem var(--f-sans);color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
input[type=number]{font-family:var(--f-mono)}
input[readonly]{opacity:.8}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.agree{display:flex;gap:12px;align-items:center;font-size:.96rem;cursor:pointer;padding:12px 14px;border-radius:var(--r-sm);background:var(--brand-soft)}
.agree input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--brand)}

.btn{font:600 .96rem/1.2 var(--f-sans);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r-sm);
  padding:11px 16px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--on-wa)}
.btn.big{width:100%;min-height:54px;font-size:1.02rem}
.btn.sm{min-height:42px;padding:8px 12px;font-size:.9rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,.agree input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.cheerline{text-align:center;font-weight:600;color:var(--brand)}
.note{border-radius:var(--r-sm);padding:11px 14px;font-size:.92rem;background:var(--bg)}
.note.warn{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.note.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- test screen ---------- */
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);color:var(--on-bar);box-shadow:var(--shadow)}
.tb-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.tb-who{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.tbar .brand{color:var(--on-bar)}
.who{font-size:.86rem;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sep{margin:0 6px;opacity:.5}
.timer{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bar-dim);border-radius:14px;padding:6px 14px}
.timer .tl{font:600 .62rem/1 var(--f-sans);letter-spacing:.06em;opacity:.85}
.timer .tv{font:700 1.3rem/1.05 var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{background:var(--alarm);color:var(--on-alarm)}
.prog{height:4px;background:var(--bar-dim)}
.prog i{display:block;height:100%;background:var(--bar-fill);border-radius:0 4px 4px 0;transition:width .25s}

.sheetmap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.sm-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sm-h .n{font:700 .8rem/1 var(--f-mono);color:var(--c2);background:var(--c2s);border-radius:999px;padding:5px 9px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px 4px}
.cell{font:600 .8rem/1 var(--f-mono);font-variant-numeric:tabular-nums;width:100%;max-width:40px;min-height:24px;aspect-ratio:1;justify-self:center;
  padding:0;min-width:0;cursor:pointer;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink-2)}
.cell.done{background:var(--c2s);border-color:var(--c2s);color:var(--c2)}
.cell.cur{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

.qsheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qno{font:700 .85rem/1 var(--f-sans);color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:7px 12px}
.qof{font:600 .85rem/1 var(--f-mono);color:var(--ink-2)}
.tag{margin-left:auto;font:600 .78rem/1 var(--f-sans);color:var(--c5);background:var(--c5s);border-radius:999px;padding:7px 11px}
.qtext{font:500 1.15rem/1.55 var(--f-sans);overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:500 1rem/1.45 var(--f-sans);text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;min-height:56px;
  border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background-color .15s}
.opt .bub{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 .9rem/1 var(--f-sans);color:var(--c);background:var(--cs);transition:background-color .15s,color .15s}
.opt.multi .bub{border-radius:9px}
.opt .ot{padding-top:4px;min-width:0;overflow-wrap:anywhere}
@media (hover:hover){ .opt:hover{border-color:var(--c)} }
.opt.on{border-color:var(--c);background:var(--cs)}
.opt.on .bub{background:var(--c);color:var(--on-c)}
.snav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.05);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.snav .in{max-width:688px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.spacer{height:88px}

.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.dlg{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dlg h3{font:700 1.15rem/1.3 var(--f-sans)}
.miss{display:flex;flex-wrap:wrap;gap:5px}
.miss span{font:600 .82rem/1 var(--f-mono);background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:6px 9px}

/* ---------- result ---------- */
.verdict{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 4px}
.ring{width:156px;max-width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--rc) calc(var(--p) * 1%), var(--line) 0)}
.ring-in{width:124px;aspect-ratio:1;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.score{font:700 2.1rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.score .of{font-size:1rem;color:var(--ink-2)}
.pct{font:700 .95rem/1 var(--f-mono);color:var(--rc)}
.cheer{font:650 1.08rem/1.35 var(--f-sans);color:var(--rc);text-align:center;text-wrap:balance}
.protocol{margin:0;display:flex;flex-direction:column;background:var(--bg);border-radius:var(--r-sm);padding:4px 14px}
.protocol>div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.protocol>div:last-child{border-bottom:0}
.protocol dt{font-size:.86rem;color:var(--ink-2)}
.protocol dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.protocol .m{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.state{display:inline-block;font:600 .8rem/1 var(--f-sans);border-radius:999px;padding:6px 10px}
.state.ok{color:var(--ok);background:var(--ok-soft)} .state.bad{color:var(--bad);background:var(--bad-soft)} .state.warn{color:var(--warn);background:var(--warn-soft)}
.rep{margin:0;padding:12px 14px;background:var(--bg);border:1.5px dashed var(--line);border-radius:var(--r-sm);font:500 .8rem/1.55 var(--f-mono);
  white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
body.testing,body.testing *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
sup,sub{line-height:0;font-size:.75em}
@media (max-width:420px){
  .title{font-size:1.3rem} .qtext{font-size:1.08rem} .spec dd{font-size:1.2rem}
  .fields{grid-template-columns:minmax(0,1fr) 92px} .protocol>div{grid-template-columns:96px minmax(0,1fr)} .sheet,.qsheet{padding:16px}
}
@media (max-width:360px){ .cell{font-size:.72rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- site: home, teacher monitor ---------- */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
a{color:var(--brand)}
.mast a.brand{text-decoration:none}
.wrap.wide{max-width:900px}
.hero{display:flex;flex-direction:column;gap:8px;padding:6px 2px 2px}
.title.big{font-size:clamp(1.6rem,1.2rem + 2vw,2.2rem)}
.tests{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:720px){ .tests{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tcard .trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font:600 .8rem/1 var(--f-sans);color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:7px 11px}
.ttl{font:700 1.2rem/1.3 var(--f-sans);text-wrap:balance}
.tkl{margin:-4px 0 0;font-size:.88rem;color:var(--ink-2)}
.tkl b{color:var(--ink);font-weight:600}
.foot{text-align:center;font-size:.92rem;padding:4px 0 10px}
.narrow{max-width:460px;width:100%;margin:0 auto}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.fallback{display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font:600 .82rem/1 var(--f-sans);color:var(--ink-2);background:var(--bg);border-radius:999px;padding:8px 12px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--c4);flex:none}
.live.on i{background:var(--ok);animation:pulse 1.6s infinite}
.live.poll i{background:var(--c3)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(19,135,90,.45)}70%{box-shadow:0 0 0 8px rgba(19,135,90,0)}100%{box-shadow:0 0 0 0 rgba(19,135,90,0)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:600 .86rem/1 var(--f-sans);border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:8px 12px;cursor:pointer;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chips button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.mstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:700px){ .mstats{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:400px){ .mstats{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stat{background:var(--cs);color:var(--c);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat b{font:700 1.9rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;font-weight:600}
.row.tight{gap:6px} .row.tight>.btn{flex:0 0 auto}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card)}
.prow.run{border-color:var(--c1);background:var(--c1s)}
.who2{display:flex;flex-direction:column;gap:3px;min-width:0}
.who2 .nm{font-weight:600;overflow-wrap:anywhere}
.who2 .sub{font-size:.8rem;color:var(--ink-2)}
.flag{font-size:.76rem;font-weight:600;color:var(--c4)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.sc{font:700 1rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.sc.run{color:var(--c1)}
.state.run{color:var(--c1);background:var(--c1s)}
.empty{padding:18px;text-align:center;color:var(--ink-2);background:var(--bg);border-radius:var(--r-sm);font-size:.92rem}
.linkrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linkrow .lk{font-weight:600;min-width:110px}
.linkrow code{flex:1 1 200px;min-width:0;font:500 .78rem/1.4 var(--f-mono);background:var(--bg);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.linkrow .btn{flex:0 0 auto}
.muted{color:var(--ink-2);font-weight:500}
/* waiting room + lesson control */
.rules li:nth-child(5){--c:var(--c3);--cs:var(--c3s)}
.wtop{display:flex;align-items:center;gap:10px}

/* camera watch */

#camdot video{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;transform:scaleX(-1);background:#0b1220;border:3px solid var(--line);box-shadow:0 6px 18px rgba(16,32,64,.22);transition:border-color .2s}

.cf{display:block;margin-top:4px;font-weight:600;color:var(--warn)}

/* mistakes review */

/* result stickers */
.verdict{position:relative}
.stk-on{position:absolute;top:-8px;left:calc(50% + 38px);width:96px;height:96px;rotate:12deg;filter:drop-shadow(0 4px 8px rgba(27,42,58,.22));pointer-events:none}
.stk-img,.stk-big{display:block;width:100%;height:100%}
.stk-pop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(12,20,32,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:16px;animation:stkfade .25s ease-out both;overflow:hidden;cursor:pointer}
.stk-pop.out{animation:stkfade .35s ease-in reverse both}

.stk-fx{position:absolute;inset:0;pointer-events:none}
.stk-fx i{position:absolute;top:-24px;left:var(--x);width:9px;height:14px;border-radius:2px;background:var(--c);animation:stkfall var(--d) ease-in var(--w) both}

@keyframes stkfade{from{opacity:0}to{opacity:1}}
@keyframes stkpop{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes stkfall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(var(--r))}}
@keyframes stkglow{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes stklift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes stkwob{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.stk-pop,.stk-pop.out,.stk-card,.stk-big,.stk-fx i{animation:none!important}.stk-fx{display:none}}

ojgilt6ry4"]],["Рэлейдің d = V/S формуласында d, V және S нені білдіреді?",["d – молекула диаметрі, V – тамшы көлемі, S – жайылған тамшының ауданы","d – тамшы диаметрі, V – молекула көлемі, S – молекула ауданы","d – молекула диаметрі, V – молекула жылдамдығы, S – жолақтың ығысуы","d – тамшының тығыздығы, V – су көлемі, S – ыдыс ауданы"],["1zuus5toyhy"]],["Рэлей бір молекуланың көлемін қалай алды?",["V_0 = d^3","V_0 = d^2","V_0 = V/S","V_0 = m/N"],["67crtez1pb"]],["Тамшы массасы m мен ондағы молекулалар саны N белгілі болғанда, Рэлей бір молекуланың массасын қалай есептеп шығарды?",["m_0 = m/N","m_0 = m·N","m_0 = N/m","m_0 = V/S"],["8rzhyi79cy"]],["Рэлей әдісі бойынша молекуланың массасы жуық шамамен қандай болып шықты?",["10^{-26} кг","10^{-9} кг","10^{-3} кг","10^{26} кг"],["1q7d1usyqfh"]],["Олеин майы тамшысының көлемі V = 6·10^{-9} м^3, ол су бетінде S = 3 м^2 ауданға жайылды. Молекуланың диаметрі d = V/S неге тең?",["2·10^{-9} м","1,8·10^{-8} м","5·10^{8} м","2·10^{9} м"],["h6xi50z2q0"]],["Олеин майы су бетінде S = 0,4 м^2 ауданға жайылды, молекуланың диаметрі d = 2·10^{-9} м. d = V/S формуласынан тамшының көлемін табыңыз.",["8·10^{-10} м^3","5·10^{-9} м^3","2·10^{8} м^3","8·10^{-9} м^3"],["2cl9u009fpc"]],["Молекуланың диаметрі d = 2·10^{-9} м. V_0 = d^3 формуласы бойынша бір молекуланың көлемі неге тең?",["8·10^{-27} м^3","6·10^{-9} м^3","4·10^{-18} м^3","8·10^{-9} м^3"],["ykynakxw6f"]],["Тамшының көлемі V = 8·10^{-9} м^3, бір молекуланың көлемі V_0 = 8·10^{-27} м^3. Тамшыдағы молекулалар саны N = V/V_0 неге тең?",["10^{18}","10^{-18}","64·10^{-36}","10^{36}"],["175qlxtt6eb"]],["Тамшының массасы m = 9·10^{-9} кг, ондағы молекулалар саны N = 3·10^{17}. Бір молекуланың массасы m_0 = m/N неге тең?",["3·10^{-26} кг","3·10^{26} кг","2,7·10^{9} кг","3,3·10^{25} кг"],["7j9tg4vh4"]],["1 тонна мұнай мұхит бетінде 12 км^2 ауданға жайылады. Жүк көтергіштігі 550 мың тонна танкерден төгілген мұнай қандай аудан алады?",["6,6·10^{6} км^2","6,6·10^{3} км^2","4,6·10^{4} км^2"," function mast(){ return '<header class="mast"><a class="brand" href="#">DAMU</a><span class="mast-r">Физика · тест</span></header>'; }

function recKey(){ return 'damu_r_' + S.cfg.id + '_' + S.slug; }
function getRec(){ return S.cfg.pv ? S.rec : store.get(recKey(), null); }
function setRec(r){ S.rec = r; if (!S.cfg.pv){ store.set(recKey(), r); LOCK.write(r); } }

/* ---------- one attempt per device ----------
   The lock is keyed by the test, not by the student's name or number, so typing another name,
   another journal number, reloading or opening a new tab all land on the same result screen.
   It is kept in three places (localStorage, IndexedDB, a cookie) so clearing one is not enough. */
function withTimeout(p, ms){ return Promise.race([p, new Promise(res => setTimeout(() => res(null), ms))]); }
function idbOpen(){ return new Promise((res, rej) => { try { const q = indexedDB.open('damu', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); } catch(e){ rej(e); } }); }
function idbGet(k){ return withTimeout(idbOpen().then(db => new Promise((res, rej) => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result || null); t.onerror = () => rej(t.error); })).catch(() => null), 800); }
function idbPut(k, v){ idbOpen().then(db => { try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch(e){} }).catch(() => {}); }
const LOCK = {
  key(){ return 'damu_lock_' + S.cfg.id; },
  ck(){ return 'damu_l_' + S.cfg.id; },
  ok(r){ return r && typeof r === 'object' && typeof r.st === 'string' ? r : null; },
  readSync(){
    let r = this.ok(store.get(this.key(), null));
    if (!r){ try { const m = document.cookie.match(new RegExp('(?:^|; )' + this.ck() + '=([^;]*)')); if (m) r = this.ok(JSON.parse(decodeURIComponent(m[1]))); } catch(e){} }
    return r;
  },
  read(){ const r = this.readSync(); return r ? Promise.resolve(r) : idbGet(this.key()).then(x => this.ok(x)); },
  write(r){
    store.set(this.key(), r);
    try { document.cookie = this.ck() + '=' + encodeURIComponent(JSON.stringify(r)) + ';max-age=31536000;path=/;SameSite=None;Secure'; } catch(e){}
    idbPut(this.key(), r);
  }
};
function slugOf(name, num){ return (name.toLowerCase().replace(/\s+/g, ' ').trim() + '#' + (num || '')).slice(0, 80); }

function studentBoot(p, tid){
  if (!Array.isArray(p) || p[0] !== 1 || !Array.isArray(p[8]) || !Array.isArray(p[9]) || !p[9].length) return fatal('Тест деректері бүлінген. Мұғалімге хабарласыңыз.');
  const cfg = { id: p[1], title: p[2], min: p[3], show: !!p[4], wa: p[6] || '', salt: p[7], bank: p[8], vs: p[9], name: p[10] || '', vn: p[11] || 0, mode: p[12], pv: !!p[13] };
  S = { cfg: cfg, tid: tid, rec: null, ans: [], cur: 0, order: [], name: cfg.name, num: '', vi: 0, slug: '', again: false, sendState: null };
  document.title = splitTitle(cfg.title)[0] + ' · DAMU';
  if (cfg.pv) return gateView();
  $('#app').innerHTML = '<main class="wrap">' + mast() + '<section class="sheet"><p class="hint">Тест ашылып жатыр…</p></section></main>';
  LOCK.read().then(r => {
    if (r) return resumeFromRec(r, true);
    if (cfg.mode === 'p'){ S.slug = slugOf(cfg.name, ''); const old = getRec(); if (old) return resumeFromRec(old, true); }
    gateView();
  });
}
/* another tab of the same browser started the test while this one still shows the cover */
window.addEventListener('storage', e => {
  if (!S || S.cfg.pv || G.on || S.rec || !e.key || e.key !== LOCK.key() || !e.newValue) return;
  const r = LOCK.readSync(); if (!r) return;
  if (r.st === 'started'){ S.rec = r; S.name = r.name || ''; S.num = r.num || ''; S.vi = r.vi || 0; return blockedView(); }
  resumeFromRec(r, true);
});
function blockedView(){
  document.body.classList.remove('testing');
  $('#app').innerHTML = '<main class="wrap">' + mast() + '<section class="sheet"><h1 class="title">Тест басқа терезеде ашылған</h1>' +
    '<div class="note bad">Тестті бір рет қана тапсыруға болады. Бұл терезені жабыңыз.</div></section></main>';
}
function resumeFromRec(r, again){
  if (again) S.again = true;
  S.rec = r; S.name = r.name || S.name; S.num = r.num || ''; S.vi = r.vi || 0; S.kl = r.kl || S.kl || '';
  if (r.st === 'started'){ r.st = 'left'; r.why = 'reload'; r.score = 0; r.total = r.total || vTotal(S.vi); setRec(r); leftView(r.why); return report('LEFT', r); }
  S.sendState = r.sent ? 'ok' : null;
  if (r.st === 'left') leftView(r.why); else resultView(r);
  if (!r.sent && !S.cfg.pv) report(finalEv(r), r);
}

      ${common ? '<div class="field"><label class="lbl" for="g_num">Журнал №</label><input type="number" id="g_num" inputmode="numeric" min="1" max="99" placeholder="7"></div>' : ''}

  $('#g_ok').onchange = e => { $('#g_go').disabled = !e.target.checked; };
  $('#g_go').onclick = startTest;

function startTest(){
  const c = S.cfg, errBox = $('#g_err');
  if (!$('#g_ok').checked) return;
  const kl = ($('#g_kl') || {}).value || '';
  if (!kl){ errBox.innerHTML = '<div class="note bad">Сыныбыңызды таңдаңыз.</div>'; return; }
  S.kl = kl; store.set('damu_kl', kl);
  const cf = $('#g_codef'), pf = $('#g_pickf');
  if (cf && !cf.hidden && !S.rosterOk){ errBox.innerHTML = '<div class="note bad">Тақтада жазылған сынып кодын енгізіңіз.</div>'; return; }
  if (pf && !pf.hidden && !$('#g_pick').value){ errBox.innerHTML = '<div class="note bad">Тізімнен атыңызды таңдаңыз.</div>'; return; }
  const name = clean($('#g_name').value);
  if (name.length < 3){ errBox.innerHTML = '<div class="note bad">Аты-жөніңізді толық жазыңыз.</div>'; return; }
  let vi = 0, num = '';
  if (c.mode !== 'p'){
    num = String(parseInt(($('#g_num') || {}).value, 10) || '');
    if (!num || +num < 1 || +num > 99){ errBox.innerHTML = '<div class="note bad">Журналдағы нөміріңізді жазыңыз (1–99).</div>'; return; }
    vi = (+num - 1) % c.vs.length;
  } else vi = Math.max(0, (c.vn || 1) - 1) % c.vs.length;
  if (window.screen && window.screen.isExtended === true){ errBox.innerHTML = '<div class="note bad">Екінші экран анықталды. Қосымша мониторды ажыратып, бетті қайта ашыңыз.</div>'; return; }
  S.name = name; S.num = num; S.vi = vi; S.slug = slugOf(name, num);
  if (!c.pv){
    const lk = LOCK.readSync(); if (lk) return resumeFromRec(lk, true);
    const old = store.get(recKey(), null); if (old) return resumeFromRec(old, true);
  }
  waitView();   // the test itself opens on the teacher's start signal (beginTest)
}

/* ---------- guard: leaving the page = 0 ---------- */
function armGuard(){
  G.on = true; G.base = window.innerWidth * window.innerHeight;
  try { history.pushState({ damu: 1 }, '', location.href); } catch(e){}
  guardWake(); document.documentElement.style.overscrollBehaviorY = 'none'; document.body.style.overscrollBehaviorY = 'none';
}
function disarmGuard(){
  G.on = false; clearInterval(G.tick); clearTimeout(G.blurT); G.blurT = 0; document.documentElement.style.overscrollBehaviorY = ''; document.body.style.overscrollBehaviorY = '';
  try { if (G.wl){ G.wl.release(); G.wl = null; } } catch(e){}
  document.body.classList.remove('testing');
  camStop();
}
function violate(why){
  if (!G.on) return;
  disarmGuard();
  const m = $('.modal'); if (m) m.remove();
  const r = Object.assign({}, S.rec || {}, { st: 'left', why: why, score: 0, total: S.order.length, secs: Math.round((Date.now() - S.t0) / 1000) });
  setRec(r);
  ctlStop();
  leftView(why);
  report('LEFT', r, true);
}
document.addEventListener('visibilitychange', () => { if (G.on && document.visibilityState === 'hidden') violate('hidden'); });
window.addEventListener('pagehide', () => { if (G.on) violate('reload'); });
window.addEventListener('beforeunload', () => {
  if (G.on && S && !S.cfg.pv){ const r = Object.assign({}, S.rec || {}, { st: 'left', why: 'reload', score: 0 }); store.set(recKey(), r); store.set(LOCK.key(), r); }
});
window.addEventListener('blur', () => guardBlur());
window.addEventListener('focus', () => guardFocus());
document.addEventListener('pointerdown', () => guardFocus(), true);
window.addEventListener('popstate', () => { if (G.on) guardBack(); });
window.addEventListener('resize', () => {
  if (!G.on) return; const a = window.innerWidth * window.innerHeight;
  if (a > G.base) G.base = a; else if (a < G.base * 0.72) violate('split');
});
if (window.screen && window.screen.addEventListener) window.screen.addEventListener('change', () => { if (G.on && window.screen.isExtended === true) violate('screens'); });
['contextmenu', 'copy', 'cut', 'paste', 'dragstart', 'selectstart'].forEach(ev => document.addEventListener(ev, e => { if (G.on) e.preventDefault(); }));
document.addEventListener('gesturestart', e => { if (G.on) e.preventDefault(); });

/* ---------- test screen ---------- */
function tick(){
  if (!G.on) return;
  const left = S.endAt - Date.now(), v = $('#tv'), t = $('#tm');
  if (v) v.textContent = fmtTime(left);
  if (t) t.classList.toggle('low', left < 5 * 60000);
  if (left <= 0) finish('TIME');
}
function testView(keepScroll){
  const c = S.cfg, total = S.order.length, i = S.cur, sy = window.pageYOffset;
  const e = S.order[i], q = c.bank[e.bi], multi = !isMatch(q) && q[2].length > 1, sel = S.ans[i];
  const answered = S.ans.filter((a, k) => ansFull(k)).length, left = S.endAt - Date.now();
  const who = esc(S.name) + (S.num ? ' · №' + esc(S.num) : '');
  $('#app').innerHTML = `
  <header class="tbar"><div class="tb-in">
    <div class="tb-who"><span class="brand">DAMU</span><span class="who">${who}<span class="sep">|</span>${S.vi + 1}-нұсқа</span></div>
    <div class="timer${left < 5 * 60000 ? ' low' : ''}" id="tm" role="timer" aria-label="Қалған уақыт"><span class="tl">Қалған уақыт</span><span class="tv" id="tv">${fmtTime(left)}</span></div>
  </div><div class="prog" aria-hidden="true"><i style="width:${Math.round(answered / total * 100)}%"></i></div></header>
  <main class="wrap">
    <section class="sheetmap" aria-label="Жауап парағы">
      <div class="sm-h"><span class="lbl">Жауап парағы</span><span class="n">${answered} / ${total}</span></div>
      <nav class="grid" style="--cols:${Math.min(10, total)}">${S.ans.map((a, k) => '<button class="cell' + ansCls(k) + (k === i ? ' cur' : '') + '" data-k="' + k + '" aria-label="Сұрақ ' + (k + 1) + (ansFull(k) ? ', жауап берілді' : '') + '"' + (k === i ? ' aria-current="step"' : '') + '>' + (k + 1) + '</button>').join('')}</nav>
    </section>
    <article class="qsheet">
      <div class="qhead"><span class="qno">Сұрақ ${i + 1}</span><span class="qof">/ ${total}</span>${isMatch(q) ? '<span class="tag">Сәйкестендіру · 2 балл</span>' : multi ? '<span class="tag">Бірнеше дұрыс жауап</span>' : ''}</div>
      <div class="qtext">${fmt(q[0])}</div>${qfig(q)}
      ${isMatch(q) ? matchHtml(q, e, sel) : ''}<div class="opts"${isMatch(q) ? ' hidden' : ''} role="${multi ? 'group' : 'radiogroup'}">${isMatch(q) ? '' : e.perm.map((oi, k) => '<button class="opt' + (multi ? ' multi' : '') + (sel.includes(k) ? ' on' : '') + '" style="--c:var(--c' + (k % 6 + 1) + ');--cs:var(--c' + (k % 6 + 1) + 's)" data-k="' + k + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + sel.includes(k) + '"><span class="bub">' + LET[k] + '</span><span class="ot">' + fmt(q[1][oi]) + '</span></button>').join('')}</div>
    </article>
    <div class="spacer"></div>
  </main>
  <footer class="snav"><div class="in">
    <button class="btn" id="n_prev" ${i === 0 ? 'disabled' : ''}>← Алдыңғы</button>
    ${i === total - 1 ? '<button class="btn primary" id="n_fin">Тестті аяқтау</button>' : '<button class="btn primary" id="n_next">Келесі →</button>'}
  </div></footer>`;
  window.scrollTo(0, keepScroll ? sy : 0);
}
document.addEventListener('click', e => {
  if (!S || !G.on) return;
  const opt = e.target.closest('.opt');
  if (opt){
    const k = +opt.dataset.k, q = S.cfg.bank[S.order[S.cur].bi], multi = !isMatch(q) && q[2].length > 1; let a = S.ans[S.cur];
    a = multi ? (a.includes(k) ? a.filter(x => x !== k) : a.concat(k)) : [k];
    S.ans[S.cur] = a; testView(true); return;
  }
  const cell = e.target.closest('.cell'); if (cell){ S.cur = +cell.dataset.k; testView(); return; }
  if (e.target.closest('#n_prev')){ if (S.cur > 0){ S.cur--; testView(); } return; }
  if (e.target.closest('#n_next')){ if (S.cur < S.order.length - 1){ S.cur++; testView(); } return; }
  if (e.target.closest('#n_fin')){ confirmFinish(); return; }
  if (e.target.closest('#m_ok')){ finish('DONE'); return; }
  if (e.target.closest('#m_no')){ const m = $('.modal'); if (m) m.remove(); return; }
});
function confirmFinish(){
  const total = S.order.length, un = S.ans.map((a, k) => a.length ? 0 : k + 1).filter(Boolean);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="m_t"><h3 id="m_t">Тестті аяқтау</h3>' +
    '<dl class="protocol"><div><dt>Жауап берілді</dt><dd class="m">' + S.ans.filter((a, k) => ansFull(k)).length + ' / ' + total + '</dd></div></dl>' +
    (un.length ? '<p class="hint">Жауапсыз сұрақтар:</p><div class="miss">' + un.map(n => '<span>' + n + '</span>').join('') + '</div>' : '') +
    halfNote() + '<p class="hint">Аяқтаған соң жауапты өзгертуге болмайды.</p>' +
    '<div class="row"><button class="btn" id="m_no">Тестке оралу</button><button class="btn primary" id="m_ok">Аяқтау</button></div></div>';
  document.body.appendChild(m);
}
function isCorrect(i){
  const e = S.order[i], q = S.cfg.bank[e.bi], picked = S.ans[i] || [];
  if (!picked.length) return false;
  return picked.map(k => oh(S.cfg.salt, q[1][e.perm[k]])).sort().join(',') === q[2].slice().sort().join(',');
}
function finish(status){
  if (!G.on) return; disarmGuard();
  const m = $('.modal'); if (m) m.remove();
  const total = ptsTotal(); let score = 0; for (let i = 0; i < S.order.length; i++) score += qPts(i);
  const r = Object.assign({}, S.rec || {}, { st: 'done', score: score, total: total, secs: Math.round((Date.now() - S.t0) / 1000), end: status, ans: S.ans.map(a => a.slice()) });
  setRec(r); ctlStop(); S.fresh = true; resultView(r);
  report(status === 'TIME' ? 'TIME' : 'DONE', r);
}

/* ---------- result message for the teacher ---------- */
function reportText(status, r){
  const c = S.cfg, total = r.total || (S.order && S.order.length) || 0, vn = (r.vi != null ? r.vi : S.vi) + 1;
  const head = { DONE: '✔ Аяқтады', TIME: '⏱ Уақыт бітті', LEFT: '✖ Беттен шықты — нәтиже 0' }[status];
  const lines = [head + ' · ' + c.title, 'Оқушы: ' + clean(S.name) + (S.kl ? ', ' + S.kl + ' сынып' : '') + (S.num ? ' (№' + S.num + ')' : ''), 'Нұсқа: ' + vn + '-нұсқа'];
  if (status !== 'LEFT') lines.push('Балл: ' + r.score + ' / ' + total + ' (' + (total ? Math.round(r.score / total * 100) : 0) + '%)');
  else lines.push('Себебі: ' + (WHY[r.why] || r.why || '—'));
  if (r.warns && r.warns.length) lines.push('Камера ескертуі: ' + r.warns.length + ' / ' + CAMCFG.max + ' (' + camList(r.warns) + ')');
  if (r.secs) lines.push('Уақыты: ' + dur(r.secs));
  if (r.t0){ const d = new Date(r.t0), p2 = n => String(n).padStart(2, '0'); lines.push('Басталды: ' + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes())); }
  lines.push(machineLine(c.id, S.name, S.num, vn, status === 'LEFT' ? 0 : (r.score || 0), total, status, r.secs || 0));
  return lines.join('\n');
}
function sendBlock(status, r){
  const c = S.cfg;
  if (c.pv) return '<section class="sheet"><div class="note">Сынақ режимі: нәтиже жіберілмейді.</div></section>';
  const text = reportText(status, r);
  const wa = 'https://wa.me/' + (c.wa || '') + '?text=' + encodeURIComponent(text);
  return '<section class="sheet"><h2 class="h2">Мұғалімге жіберу</h2><div id="sendst">' + sendNote() + '</div>' +
    '<div class="fallback" id="fallback"' + (S.sendState === 'fail' ? '' : ' hidden') + '>' +
    '<div class="row"><button class="btn primary" id="r_retry">Қайта жіберу</button><button class="btn" id="r_cp">Мәтінді көшіру</button></div>' +
    '<a class="btn primary wa big" target="_blank" rel="noopener" href="' + esc(wa) + '">Мұғалімге WhatsApp-пен жіберу</a>' +
    '<pre class="rep">' + esc(text) + '</pre></div></section>';
}
function bindShare(status, r){ const cp = $('#r_cp'); if (cp) cp.onclick = () => copyText(reportText(status, r), 'Нәтиже көшірілді'); const rt = $('#r_retry'); if (rt) rt.onclick = () => report(status, S.rec || r); }
function protocol(rows){ return '<dl class="protocol">' + rows.map(x => '<div><dt>' + x[0] + '</dt><dd' + (x[2] ? ' class="m"' : '') + '>' + x[1] + '</dd></div>').join('') + '</dl>'; }
function candidateRows(r){
  const rows = [['Тапсырушы', esc(S.name)]];
  if (S.kl) rows.push(['Сынып', esc(S.kl)]);
  if (S.num) rows.push(['Журнал №', esc(S.num), 1]);
  rows.push(['Нұсқа', ((r.vi != null ? r.vi : S.vi) + 1) + '-нұсқа']);
  if (r.secs) rows.push(['Уақыты', dur(r.secs), 1]);
  return rows;
}
function ring(score, total, pct, color, msg){
  return '<div class="verdict" style="--rc:' + color + '"><div class="ring" style="--p:' + pct + '" role="img" aria-label="' + score + ' / ' + total + '"><div class="ring-in"><div class="score">' + score + '<span class="of"> / ' + total + '</span></div><div class="pct">' + pct + '%</div></div></div><p class="cheer">' + esc(msg) + '</p></div>';
}
function cheer(p){
  if (p >= 90) return 'Керемет! Тақырыпты өте жақсы меңгергенсіз.';
  if (p >= 70) return 'Жақсы нәтиже! Аздап қайталасаңыз болғаны.';

/* =====================================================================
   CAMERA WATCH
   The front camera picture never leaves the phone: a face model (MediaPipe Face Landmarker)
   runs here in the browser, and only the number and kind of warnings go to the teacher.
   Watched: head turned aside, talking (jaw opening and closing),
   no face in the picture, a second person close to the camera.
   Each warning: sound + vibration + red banner. Warning number CAMCFG.max → result 0.
   ===================================================================== */
const CAMCFG = {
  lib: ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21', 'https://unpkg.com/@mediapipe/tasks-vision@0.10.21'],
  model: ['vendor/face_landmarker.task', 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'],

  cool: 5000,        // after a warning: time to correct before anything counts again
  turn: 0.3,         // head turn: nose position across the face moved this far from the student's usual look (≈ 25–30°)
  turnMs: 2000,
  baseN: 240,        // the usual look = median of the last ~30 s of frames, so it follows the student and the phone position
  // (eye direction is NOT used: with a real face it reads "to the side" whenever the head is a little turned and the eyes look at the camera)
  awayMs: 5000,      // no face in the picture
  twoSize: 0.55,     // a second face counts when it is at least this wide compared to the student's own and does not overlap it
  twoMs: 1500,
  jawHi: 0.2, jawLo: 0.08, talkWin: 3000, talkN: 4,    // talking: 4 open–close cycles of the jaw within 3 s
  stale: 1500,       // no new camera frame for this long: nothing is judged (a frozen picture is never taken as the student)

const CAMMSG = { turn: 'Жан-жағыңызға қарамаңыз', talk: 'Сөйлеспеңіз', away: 'Бетіңіз камерада көрінбейді', two: 'Камерада басқа адам бар' };
const CAMKIND = { turn: 'жан-жағына қарады', talk: 'сөйлесті', away: 'беті көрінбеді', two: 'қасында басқа адам' };
const CAMHINT = { turn: 'Экранға қараңыз', talk: 'Сөйлемеңіз', away: 'Бетіңізді камераға көрсетіңіз', two: 'Камерада тек өзіңіз болыңыз' };
const CAMVER = '2026-11-02 · 4';
const CAM = { state: 'off', stream: null, video: null, lm: null, loading: false, timer: 0, gap: 125, armed: false, warns: [],
  cool: 0, since: {}, jaw: { open: false, cycles: [] }, base: null, samples: [], dead: false, face: null, ac: null, sent: '', practice: false,
  fresh: 0, ct: -1, nfr: 0, done: -1, revAt: 0, reviving: false, diag: {}, log: [], seen: false, engine: '', cv: null, cx: null };
function camLive(){ return G.on || CAM.practice; }

function camReady(){ return CAM.state === 'ok' || CAM.state === 'ai' || CAM.state === 'noai'; }
function camSet(st){
  if (CAM.state === st) return;
  CAM.state = st; camPaint();
  if (CAM.practice && st === 'ai') camArm();
  if (S && S.waiting){
    if (/^(ai|noai|denied|nocam)$/.test(st) && CAM.sent !== st){ CAM.sent = st; live('JOIN', { vi: S.vi }); }
    if (typeof onCtl === 'function') onCtl();

}
function camEl(){
  let el = $('#camdot');
  if (!el){
    el = document.createElement('div'); el.id = 'camdot'; el.setAttribute('aria-hidden', 'true');
    el.innerHTML = '<video muted autoplay playsinline webkit-playsinline></video><b class="cn"></b><span class="ch"></span>';
    document.body.appendChild(el);

/* ---------- sound + vibration ---------- */
function camAudio(){   // called from a tap, so the phone lets the page play sound later
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!CAM.ac && A) CAM.ac = new A();
    const ac = CAM.ac; if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0.0001; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.03);
  } catch(e){}
}
function camBuzz(final){
  try { if (navigator.vibrate) navigator.vibrate(final ? [600, 150, 600, 150, 600] : [350, 120, 350]); } catch(e){}
  const ac = CAM.ac; if (!ac) return;
  try {
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime + 0.03, n = final ? 5 : 3;

      o.type = 'square'; o.frequency.value = i % 2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.3, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.19);
      o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + 0.21);
    }

}

/* ---------- camera + model ---------- */
function camStart(){
  camAudio(); camEl();
  if (CAM.stream && CAM.stream.active){ camSet('ok'); camModel(); return; }
  const md = navigator.mediaDevices;
  if (!md || !md.getUserMedia){ camSet('nocam'); return; }
  camSet('asking');
  md.getUserMedia({ audio: false, video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } }).then(st => {
    if (!CAM.practice && (!S || (!S.waiting && !G.on))){ st.getTracks().forEach(t => t.stop()); return; }
    camUse(st);
    camSet('ok'); camModel();
  }).catch(e => camSet(e && /NotAllowed|Security|Permission/i.test(e.name || '') ? 'denied' : 'nocam'));
}
function camUse(st){
  if (CAM.stream && CAM.stream !== st){ try { CAM.stream.getTracks().forEach(t => t.stop()); } catch(e){} }
  CAM.stream = st; CAM.dead = false;
  const v = camEl().querySelector('video'); v.srcObject = st;
  const p = v.play(); if (p && p.catch) p.catch(() => {});
  st.getVideoTracks().forEach(tr => tr.addEventListener('ended', () => { if (CAM.stream === st) CAM.dead = true; }));
  CAM.fresh = performance.now(); CAM.ct = -1;
  if (v.requestVideoFrameCallback){
    const cb = () => { if (CAM.video !== v || CAM.stream !== st) return; CAM.fresh = performance.now(); CAM.nfr++; v.requestVideoFrameCallback(cb); };
    v.requestVideoFrameCallback(cb);
  }
}
/* the picture stopped: play again, and if the camera itself ended, open it again (permission is already given) */
function camRevive(){
  const now = Date.now(); if (CAM.reviving || now - CAM.revAt < 4000) return; CAM.revAt = now;
  const v = CAM.video; if (v){ try { const p = v.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} }
  const tr = CAM.stream && CAM.stream.getVideoTracks()[0];
  if (tr && tr.readyState === 'live' && !CAM.dead) return;
  const md = navigator.mediaDevices; if (!md || !md.getUserMedia) return;
  CAM.reviving = true;
  md.getUserMedia({ audio: false, video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
    .then(st => { if (CAM.video) camUse(st); else st.getTracks().forEach(t => t.stop()); })
    .catch(() => {}).then(() => { CAM.reviving = false; });
}
async function camLoad(){
  let lib = null, base = '';
  for (const b of CAMCFG.lib){ try { lib = await import(b + '/vision_bundle.mjs'); base = b; break; } catch(e){} }
  if (!lib) throw new Error('lib');
  let buf = null;
  for (const u of CAMCFG.model){
    try { const r = await fetch(u); if (r.ok){ const b = new Uint8Array(await r.arrayBuffer()); if (b.length > 100000){ buf = b; break; } } } catch(e){}
  }
  if (!buf) throw new Error('model');
  const files = await lib.FilesetResolver.forVisionTasks(base + '/wasm');
  const make = d => lib.FaceLandmarker.createFromOptions(files, { baseOptions: { modelAssetBuffer: buf.slice(), delegate: d },
    runningMode: 'VIDEO', numFaces: 2, outputFaceBlendshapes: true });
  // processor (CPU) first: on some Android phones (seen on a Samsung) the graphics-card path runs but never finds a face
  try { const lm = await make('CPU'); CAM.engine = 'CPU'; return lm; } catch(e){ const lm = await make('GPU'); CAM.engine = 'GPU'; return lm; }
}
function camModel(){
  if (CAM.lm){ camSet('ai'); camLoop(); return; }
  if (CAM.loading) return;
  CAM.loading = true;
  const to = setTimeout(() => { if (!CAM.lm && CAM.state === 'ok') camSet('noai'); }, CAMCFG.loadMs);
  camLoad().then(lm => {
    clearTimeout(to); CAM.loading = false; CAM.lm = lm;
    if (CAM.state === 'ok' || CAM.state === 'noai'){ camSet('ai'); camLoop(); }
  }).catch(() => { clearTimeout(to); CAM.loading = false; if (CAM.state === 'ok') camSet('noai'); });
}
function camLoop(){
  clearTimeout(CAM.timer);
  const step = () => {
    if (!CAM.lm || !CAM.stream || !CAM.video) return;
    const v = CAM.video, t0 = performance.now();
    if (v.currentTime !== CAM.ct){ CAM.ct = v.currentTime; CAM.fresh = t0; CAM.nfr++; }
    const quiet = t0 - CAM.fresh;
    CAM.diag.stale = CAM.dead || quiet > CAMCFG.stale;
    if (CAM.diag.stale){
      camRevive();
      if (CAM.dead || quiet > CAMCFG.staleAway) camJudge({ faceLandmarks: [] }, Date.now());
      else { CAM.since = {}; camHint({}); }
    } else if (CAM.nfr !== CAM.done && v.readyState >= 2 && v.videoWidth){
      CAM.done = CAM.nfr;
      let res = null; try { res = CAM.lm.detectForVideo(camFrame(v), t0); } catch(e){}
      if (res) camJudge(res, Date.now());
      CAM.gap = Math.min(400, Math.max(125, (performance.now() - t0) * 4));   // slow phones look less often
    }
    CAM.timer = setTimeout(step, CAM.gap);

}
/* copy the current camera frame into a small 2D canvas (≈400 px wide): the same picture on every phone, and less work */
function camFrame(v){
  if (!CAM.cv){ CAM.cv = document.createElement('canvas'); CAM.cx = CAM.cv.getContext('2d', { willReadFrequently: true }); }
  const w = 400, h = Math.max(1, Math.round(w * v.videoHeight / v.videoWidth));
  if (CAM.cv.width !== w || CAM.cv.height !== h){ CAM.cv.width = w; CAM.cv.height = h; }
  CAM.cx.drawImage(v, 0, 0, w, h);
  return CAM.cv;
}
/* what goes to the teacher: "noface" while the model is ready but has not found this student's face even once */
function camWire(){ return CAM.state === 'ai' && !CAM.seen ? 'noface' : CAM.state; }
function camStop(){
  CAM.armed = false; clearTimeout(CAM.timer);
  if (CAM.stream){ try { CAM.stream.getTracks().forEach(t => t.stop()); } catch(e){} CAM.stream = null; }
  const el = $('#camdot'); if (el) el.remove(); CAM.video = null;
  if (/^(asking|ok|ai|noai)$/.test(CAM.state)) CAM.state = 'off';
  CAM.sent = ''; CAM.samples = []; CAM.base = null; CAM.practice = false; CAM.seen = false;

/* ---------- judging one frame ---------- */
function camIoU(A, B){
  const ix = Math.max(0, Math.min(A[1], B[1]) - Math.max(A[0], B[0])), iy = Math.max(0, Math.min(A[3], B[3]) - Math.max(A[2], B[2]));
  const I = ix * iy, U = (A[1] - A[0]) * (A[3] - A[2]) + (B[1] - B[0]) * (B[3] - B[2]) - I;
  return U > 0 ? I / U : 0;
}
function camMedian(a){ const b = a.slice().sort((x, y) => x - y); return b[b.length >> 1]; }
function camJudge(res, t){
  const all = (res.faceLandmarks || []).map((pts, i) => {
    let a = 1, b = 0, c = 1, d = 0; for (const p of pts){ if (p.x < a) a = p.x; if (p.x > b) b = p.x; if (p.y < c) c = p.y; if (p.y > d) d = p.y; }
    return { pts: pts, w: b - a, box: [a, b, c, d], bs: res.faceBlendshapes && res.faceBlendshapes[i] };
  }).sort((x, y) => y.w - x.w);
  const faces = all.filter((f, i) => !all.slice(0, i).some(g => camIoU(f.box, g.box) > 0.1));   // the same face found twice is one face
  const f = faces[0], sig = {};

    CAM.seen = true;
    if (S && S.waiting) live('JOIN', { vi: S.vi });
    else if (S && G.on && S.rec) live('WARN', Object.assign({}, S.rec, { warn: CAM.warns.length, wk: '' }));
  }
  if (f){
    const L = f.pts[234], R = f.pts[454], N = f.pts[1];
    const ratio = L && R && N && Math.abs(R.x - L.x) > 1e-3 ? (N.x - L.x) / (R.x - L.x) : 0.5;
    const bs = {}; ((f.bs && f.bs.categories) || []).forEach(c => { bs[c.categoryName] = c.score; });
    // the student's usual look at the screen: median of the recent frames (follows the phone position, ignores short turns)
    CAM.samples.push(ratio); if (CAM.samples.length > CAMCFG.baseN) CAM.samples.shift();
    if (CAM.samples.length >= 8) CAM.base = camMedian(CAM.samples);
    const dev = CAM.base == null ? 0 : Math.abs(ratio - CAM.base);
    sig.turn = dev > CAMCFG.turn;
    const jaw = bs.jawOpen || 0, J = CAM.jaw;
    CAM.diag.dev = dev; CAM.diag.jaw = jaw;
    if (!J.open && jaw > CAMCFG.jawHi){ J.open = true; J.cycles.push(t); }

    J.cycles = J.cycles.filter(x => t - x < CAMCFG.talkWin);

  const need = { away: CAM.awayHold ? GUARD.awayAgain : CAMCFG.awayMs, two: CAMCFG.twoMs, turn: CAMCFG.turnMs, talk: 0 };
  for (const k of ['away', 'two', 'turn', 'talk']){
    if (k === 'away' && !CAM.seen) continue;   // the model has never found this face: no "not visible" warnings (the teacher sees a flag instead)
    if (sig[k]){ if (!CAM.since[k]) CAM.since[k] = t; if (t - CAM.since[k] >= need[k]) return camWarn(k); }
    else delete CAM.since[k];

}

/* ---------- during the test ---------- */
function camArm(){

/* ---------- synchronized start ----------
   The teacher's page posts {kind:'ctl', t, cmd:'start'|'stop', sess} to a second channel.
   Students wait in a waiting room; 'start' opens the test for everyone at once with one common end time;
   entry closes SYNC.grace ms after the start; 'stop' hands in every running test. */
const SYNC = { grace: 120000 };
const CTL = { es: null, list: [], seen: new Set(), skew: 0, conn: 'off', poll: 0, cb: null };
function ctlUrl(){ return LIVE.url + LIVE.topic + '-ctl'; }
function ctlIngest(m){
  if (!m || m.event !== 'message' || !m.id || CTL.seen.has(m.id)) return false;
  let d; try { d = JSON.parse(m.message); } catch(e){ return false; }
  if (!d || d.v !== 1 || d.kind !== 'ctl' || !TESTS[d.t] || !/^(start|stop)$/.test(d.cmd)) return false;
  CTL.seen.add(m.id); CTL.list.push({ id: m.id, time: m.time, d: d }); return true;
}
function ctlFire(){ if (CTL.cb) CTL.cb(); }
function ctlConnect(cb){
  ctlStop(); CTL.cb = cb;
  const skewFrom = e => { try { const x = JSON.parse(e.data); if (x && x.time){ CTL.skew = Date.now() - x.time * 1000; CTL.skewSse = true; } } catch(_){} };
  const poll = () => fetch(ctlUrl() + '/json?poll=1&since=all').then(r => r.ok ? r.text() : Promise.reject()).then(t => {
      t.split('\n').forEach(l => { if (l.trim()) try { ctlIngest(JSON.parse(l)); } catch(e){} });
      if (CTL.conn !== 'on') CTL.conn = 'poll'; ctlFire();
    }).catch(() => { if (CTL.conn !== 'on'){ CTL.conn = 'off'; ctlFire(); } });
  poll();
  if (window.EventSource){
    try {
      const es = CTL.es = new EventSource(ctlUrl() + '/sse?since=all');
      es.addEventListener('open', e => { CTL.conn = 'on'; if (e.data) skewFrom(e); ctlFire(); });
      es.addEventListener('keepalive', skewFrom);
      es.onerror = () => { if (CTL.conn === 'on'){ CTL.conn = 'off'; ctlFire(); } };
      es.onmessage = e => { try { if (ctlIngest(JSON.parse(e.data))) ctlFire(); } catch(x){} };
    } catch(e){ CTL.es = null; }
  }
  CTL.poll = setInterval(() => { if (CTL.conn !== 'on') poll(); }, 5000);
}
function ctlStop(){ clearInterval(CTL.poll); CTL.cb = null; if (CTL.es){ try { CTL.es.close(); } catch(e){} CTL.es = null; } }
function ctlLast(t){ let b = null; CTL.list.forEach(x => { if (x.d.t === t && (!b || x.time >= b.time)) b = x; }); return b; }
function ctlState(t){
  const last = ctlLast(t), min = TESTS[t] ? TESTS[t].p[3] : 0;
  if (!last || last.d.cmd !== 'start') return { mode: 'idle', last: last };
  const start = last.time * 1000 + CTL.skew, end = start + min * 60000;
  if (Date.now() >= end) return { mode: 'idle', last: last, ended: true };
  return { mode: 'run', start: start, end: end, sess: last.d.sess, last: last };
}
function waitView(){
  S.waiting = true; if (!S.joinAt) S.joinAt = Date.now(); document.title = 'Күту залы · DAMU'; document.body.classList.remove('testing');
  const rows = [['Тапсырушы', esc(S.name)]]; if (S.kl) rows.push(['Сынып', esc(S.kl)]); if (S.num) rows.push(['Журнал №', esc(S.num), 1]);
  $('#app').innerHTML = '<main class="wrap">' + mast() + `<section class="sheet waitc">
      <div class="wtop"><span class="pulse" aria-hidden="true"></span><p class="eyebrow">Күту залы</p></div>
      <h1 class="title">Мұғалімнің белгісін күтіңіз</h1>
      <p class="hint">Мұғалім «Бастау» батырмасын басқанда, сұрақтар барлық оқушыда бірден ашылады. Бетті жаппаңыз.</p>
      ${protocol(rows)}

      <p class="hint camp">Видео жазылмайды және ешқайда жіберілмейді: бетті тану тек осы телефонның ішінде жүреді.</p>
      <div id="wst" aria-live="polite"><div class="note">Байланыс орнатылуда…</div></div>
    </section></main>`;
  camStart(); camPaint();

  ctlConnect(onCtl);
}
function onCtl(){
  if (!S || S.cfg.pv) return;
  const st = ctlState(S.tid);
  if (S.waiting){
    if (st.mode === 'run'){
      if (Date.now() - st.start <= SYNC.grace || (S.joinAt && S.joinAt - st.start <= SYNC.grace)){
        if (camReady()){ S.sess = st.sess; return beginTest(st.end); }
        const w0 = $('#wst'); if (w0) w0.innerHTML = '<div class="note bad"><b>Тест басталды, бірақ камера қосылмайынша сұрақтар ашылмайды.</b> Камераны ' + Math.round(SYNC.grace / 60000) + ' минут ішінде қосыңыз.</div>';
        return;
      }
      return lateView();
    }
    const w = $('#wst');
    if (w) w.innerHTML = CTL.conn === 'off' ? '<div class="note warn">Байланыс жоқ. Интернетті тексеріңіз, бет өзі қайта қосылады.</div>'
      : '<div class="note ok">Байланыс бар. Мұғалім тестті әлі бастаған жоқ.</div>';
    return;
  }
  if (G.on && st.last && st.last.d.cmd === 'stop' && S.sess && st.last.d.sess === S.sess) finish('TIME');
}
function beginTest(endAt){
  const c = S.cfg, vi = S.vi;
  if (!c.pv){ const lk = LOCK.readSync(); if (lk){ S.waiting = false; ctlStop(); return resumeFromRec(lk, true); } }

  setRec({ st: 'started', name: S.name, num: S.num, kl: S.kl || '', vi: vi, t0: S.t0, total: ptsTotal(), sess: S.sess || '', endAt: S.endAt });

  armGuard();

  clearInterval(G.tick); G.tick = setInterval(tick, 500);
}
function lateView(){

/* ---------- classes ---------- */
const CLASSES = ['7 Г', '7 Ж', '8 В', '8 Г', '8 Ж', '10 А', '10 Ә', '10 В', '10 Г'];
/* a test can be meant for some classes only (TESTS[id].classes) */
function testClasses(id){ return (TESTS[id] && TESTS[id].classes) || CLASSES; }
function classField(){
  const last = store.get('damu_kl', '');
  return '<div class="field"><label class="lbl" for="g_kl">Сыныбыңыз</label><select id="g_kl"><option value="">Сыныпты таңдаңыз</option>' +
    testClasses(S && S.tid).map(c => '<option' + (c === last ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>';
}
/* ---------- class code → name list ----------
   The class lists are in this file only encrypted (AES-GCM, key from the class code via PBKDF2).
   The teacher writes the class code on the board; a student types it and picks their name. */
const LOOKALIKE = { 'А': 'A', 'В': 'B', 'Е': 'E', 'К': 'K', 'М': 'M', 'Н': 'H', 'О': 'O', 'Р': 'P', 'С': 'C', 'Т': 'T', 'Х': 'X', 'У': 'Y', 'Ү': 'Y', 'Ұ': 'Y', 'З': '3' };
function normCode(v){ return String(v || '').toUpperCase().replace(/\s+/g, '').split('').map(ch => LOOKALIKE[ch] || ch).join('').replace(/[^A-Z0-9]/g, ''); }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openRoster(kl, code){
  const e = ROSTER_ENC.cls[kl]; if (!e || !window.crypto || !crypto.subtle) return null;
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(e.s), iterations: ROSTER_ENC.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const list = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.i) }, key, b64(e.c))));
    return Array.isArray(list) ? list : null;
  } catch(err){ return null; }
}
function codeFields(){
  return '<div class="field" id="g_codef" hidden><label class="lbl" for="g_code">Сынып коды (тақтада жазылған)</label><input type="text" id="g_code" class="codein" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="K7P2QX"></div>' +
    '<div id="g_codemsg" aria-live="polite"></div>' +
    '<div class="field" id="g_pickf" hidden><label class="lbl" for="g_pick">Аты-жөніңіз</label><select id="g_pick"></select></div>';
}
function wireGate(){
  const sel = $('#g_kl'); if (!sel || !S || S.cfg.mode === 'p') return;
  const codeF = $('#g_codef'), pickF = $('#g_pickf'), manual = $('#g_manual'), msg = $('#g_codemsg'), pick = $('#g_pick'), nameI = $('#g_name'), numI = $('#g_num');
  const clearWho = () => { nameI.value = ''; if (numI) numI.value = ''; };
  let busy = 0;
  const refresh = () => {
    const kl = sel.value, has = !!(kl && ROSTER_ENC.cls[kl]);
    busy++; S.rosterOk = false; S.rosterList = null;
    codeF.hidden = !has; pickF.hidden = true; manual.hidden = has; msg.innerHTML = ''; pick.innerHTML = ''; $('#g_code').value = ''; clearWho();
  };
  const tryCode = async () => {
    const kl = sel.value, code = normCode($('#g_code').value);
    S.rosterOk = false; pickF.hidden = true; manual.hidden = true; clearWho();
    if (code.length < 6){ msg.innerHTML = ''; return; }
    const my = ++busy; msg.innerHTML = '<div class="note">Код тексерілуде…</div>';
    const list = await openRoster(kl, code.slice(0, 6));
    if (my !== busy) return;
    if (!list){ msg.innerHTML = '<div class="note bad">Код қате. Тақтадағы кодты тексеріп, қайта жазыңыз.</div>'; return; }
    S.rosterOk = true; S.rosterList = list;
    msg.innerHTML = '<div class="note ok">Код дұрыс. Енді тізімнен атыңызды таңдаңыз.</div>';
    pick.innerHTML = '<option value="">Атыңызды таңдаңыз</option>' + list.map((n, i) => '<option value="' + (i + 1) + '">' + (i + 1) + '. ' + esc(n) + '</option>').join('') + '<option value="none">Менің атым тізімде жоқ</option>';
    pickF.hidden = false;
  };
  sel.addEventListener('change', refresh);
  $('#g_code').addEventListener('input', tryCode);
  pick.addEventListener('change', () => {
    const v = pick.value;
    if (v === 'none'){ manual.hidden = false; clearWho(); nameI.focus(); return; }
    manual.hidden = true;
    if (!v) return clearWho();
    nameI.value = S.rosterList[+v - 1]; if (numI) numI.value = v;
  });
  refresh();
}

/* class lists live only on the teacher's device (never in the public site) */
function rosters(){ const r = store.get('damu_roster', {}); return r && typeof r === 'object' ? r : {}; }
/* one class, or several at once: a line holding only a class name ("8 В", "# 8 В", "8В сыныбы") starts that class */
function parseRoster(txt, fallback){
  const out = {}, codes = {}; let cur = null, multi = false;
  String(txt).split('\n').forEach(line => {
    const l = clean(line); if (!l) return;
    const cm = l.match(/^код\s*[:\-]?\s*([A-Za-z0-9]{6})$/i);
    if (cm){ if (cur) codes[cur] = cm[1].toUpperCase(); return; }
    const h = l.replace(/^#+\s*/, '').replace(/\s*сыныб[ыі]?\s*$/i, '').replace(/\s+/g, '').toUpperCase();
    const kl = CLASSES.find(c => c.replace(/\s+/g, '').toUpperCase() === h);
    if (kl){ cur = kl; multi = true; out[kl] = out[kl] || []; return; }
    const name = clean(l.replace(/^\s*\d+\s*[.)]?\s*/, ''));
    if (name.length >= 3 && !/\d/.test(name)){ const k = cur || fallback; (out[k] = out[k] || []).push(name); }
  });
  return { out: out, multi: multi, codes: codes };
}
function normName(n){ return clean(n).toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-яәғқңөұүһі\s-]/gi, '').split(/\s+/).filter(Boolean); }
function sameStudent(rosterName, typed){
  const a = normName(rosterName).slice(0, 2), b = normName(typed);
  if (!a.length || !b.length) return false;
  if (a.every(w => b.includes(w))) return true;
  return b.length >= 2 && b.slice(0, 2).every(w => normName(rosterName).includes(w));
}

function loadMon(){

function saveMon(){ const arr = [...MON.ev.values()].sort((a, b) => a.time - b.time).slice(-3000); store.set('damu_mon', arr); }
let saveT = 0;
function ingest(m){
  if (!m || m.event !== 'message' || !m.id || MON.ev.has(m.id)) return;
  if (m.time * 1000 <= (MON.cleared || 0)) return;
  let d; try { d = JSON.parse(m.message); } catch(e){ return; }
  if (!d || d.v !== 1 || !(TESTS[d.t] || UBT[d.t]) || typeof d.name !== 'string') return;
  MON.ev.set(m.id, { id: m.id, time: m.time, d: d }); MON.last = Math.max(MON.last, m.time);
  clearTimeout(saveT); saveT = setTimeout(saveMon, 400);
  clearTimeout(MON.rt); MON.rt = setTimeout(renderMon, 120);
}
function setConn(s){
  MON.conn = s; const el = $('#conn'); if (!el) return;
  el.className = 'live' + (s === 'on' ? ' on' : s === 'poll' ? ' poll' : '');
  el.lastChild.textContent = s === 'on' ? 'Тікелей байланыс' : s === 'poll' ? 'Әр 15 секунд сайын жаңарады' : 'Байланыс жоқ, қайта қосылуда…';
}
function pollOnce(){
  const since = MON.last ? MON.last : 'all';
  return fetch(LIVE.url + LIVE.topic + '/json?poll=1&since=' + since).then(r => r.ok ? r.text() : '').then(t => {
    t.split('\n').forEach(line => { if (!line.trim()) return; try { ingest(JSON.parse(line)); } catch(e){} });
    if (MON.conn !== 'on') setConn('poll');
  }).catch(() => { if (MON.conn !== 'on') setConn('off'); });
}
function connectLive(){
  if (MON.es){ try { MON.es.close(); } catch(e){} MON.es = null; }
  clearInterval(MON.poll);
  pollOnce();
  if (window.EventSource){
    try {
      MON.es = new EventSource(LIVE.url + LIVE.topic + '/sse?since=' + (MON.last || 'all'));
      MON.es.onopen = () => setConn('on');
      MON.es.onerror = () => { if (MON.conn === 'on') setConn('off'); };
      MON.es.onmessage = e => { try { ingest(JSON.parse(e.data)); } catch(x){} };
    } catch(e){ MON.es = null; }
  }
  MON.poll = setInterval(() => { if (MON.conn !== 'on') pollOnce(); }, 15000);
}
function stopMon(){ ctlStop(); clearInterval(MON.timer); clearInterval(MON.poll); if (MON.es){ try { MON.es.close(); } catch(e){} MON.es = null; } }
function monRows(opt){
  opt = opt || {};
  const now = Date.now(), d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const map = new Map();
  [...MON.ev.values()].sort((a, b) => a.time - b.time).forEach(x => {
    const d = x.d, t = x.time * 1000;
    if (!opt.all && MON.filter !== 'all' && d.t !== MON.filter) return;
    if (!opt.all && MON.kl !== 'all' && (d.kl || '') !== MON.kl) return;
    if (MON.day === 'today' && t < d0.getTime()) return;
    const key = d.t + '|' + (d.kl || '') + '|' + clean(d.name).toLowerCase() + '|' + (d.num || '');
    let s = map.get(key);
    if (!s){ s = { t: d.t, kl: d.kl || '', name: clean(d.name), num: d.num || '', vn: d.vn, total: d.total, min: d.min || 30, devs: new Set(), starts: 0, start: 0, fin: null }; map.set(key, s); }
    s.devs.add(d.dev);
    if (d.cam) s.cam = d.cam;
    if (d.warn) s.warn = Math.max(s.warn || 0, d.warn);
    if (d.ev === 'WARN'){ s.wk = d.wk; return; }
    if (d.ev === 'JOIN'){ s.join = t; s.vn = d.vn; s.total = d.total; }
    else if (d.ev === 'START'){ s.starts++; if (!s.start) s.start = d.t0 || t; s.vn = d.vn; s.total = d.total; }
    else if (!s.fin){ s.fin = d; s.vn = d.vn; s.total = d.total; if (!s.start) s.start = d.t0 || t; }
  });
  return [...map.values()].map(s => {
    let st, cls, score = null, rank;
    if (!s.fin && !s.start){
      const cs = ctlState(s.t), lastT = cs.last ? cs.last.time * 1000 : 0;
      const waiting = (cs.mode === 'idle' && s.join > lastT) || (cs.mode === 'run' && now - cs.start <= SYNC.grace);
      return Object.assign(s, waiting ? { st: 'Күтуде', cls: 'wait', score: null, rank: 0, secs: 0, start: s.join }
                                      : { st: 'Бастамады', cls: 'bad', score: 0, rank: 4, secs: 0, start: s.join });
    }
    if (s.fin){
      if (s.fin.ev === 'LATE'){ st = 'Кешікті'; cls = 'bad'; score = 0; rank = 3; }
      else if (s.fin.ev === 'LEFT'){ st = 'Беттен шықты'; cls = 'bad'; score = 0; rank = 3; }
      else { st = s.fin.ev === 'TIME' ? 'Уақыт бітті' : 'Аяқтады'; cls = s.fin.ev === 'TIME' ? 'warn' : 'ok'; score = s.fin.score; rank = 2; }
    } else if (now - s.start < (s.min + 2) * 60000){ st = 'Тестте'; cls = 'run'; rank = 1; }
    else { st = 'Аяқтамады'; cls = 'bad'; score = 0; rank = 4; }
    return Object.assign(s, { st: st, cls: cls, score: score, rank: rank, secs: s.fin ? s.fin.secs : Math.round((now - s.start) / 1000), why: s.fin && s.fin.why });
  }).sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name, 'kk'));
}
function mmss(ms){ ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function publishCtl(t, cmd, sess){

  fetch(ctlUrl(), { method: 'POST', body: body }).then(r => { if (!r.ok) throw 0; toast(cmd === 'start' ? 'Тест басталды' : 'Тест тоқтатылды'); })
    .catch(() => toast('Белгі жіберілмеді. Интернетті тексеріп, қайта басыңыз.'));
}

function hhmm(ms){ const d = new Date(ms), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()); }

/* =====================================================================
   MISTAKES REVIEW on the result screen
   Every question can carry a note: where the answer is in the textbook (page, paragraph) and,
   for a problem, how it is solved. Notes are scrambled with a key made from the right answer
   (the page itself only keeps hashes of the right answers), so the page source does not give
   the solutions away. The review opens for everyone at once: when the lesson's common time is
   over or when the teacher presses «Тоқтату» — so a student who finishes early cannot pass the
   right answers to classmates who are still writing.
   ===================================================================== */
function xBytes(key, n){
  let s = (cyrb53(key) % 4294967296) >>> 0 || 1; const out = new Uint8Array(n);
  for (let i = 0; i < n; i++){ s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; out[i] = s & 255; }
  return out;
}
function xKey(salt, q){ return salt + '\u0001' + (Array.isArray(q[3]) ? q[3].map((_, r) => q[1].find(t => oh(salt, 'AB'[r] + '|' + t) === q[2][r]) || '').join('\u0001') : q[1].filter(t => q[2].includes(oh(salt, t))).sort().join('\u0001')); }
function xOpen(salt, q, b){
  try {
    const bin = atob(b), ks = xBytes(xKey(salt, q), bin.length), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) ^ ks[i];
    const o = JSON.parse(new TextDecoder().decode(u));
    return o && typeof o === 'object' ? o : null;
  } catch(e){ return null; }
}
const RV = { timer: 0 };
function rvNote(bi){ const t = TESTS[S.tid], b = t && t.x && t.x[bi]; return b ? xOpen(S.cfg.salt, S.cfg.bank[bi], b) : null; }
function rvItems(r){
  const c = S.cfg, vi = r.vi != null ? r.vi : S.vi;
  if (!Array.isArray(r.ans) || !c.vs[vi]) return null;
  return c.vs[vi].map((v, i) => {
    const bi = v[0], perm = v.slice(1), q = c.bank[bi];
    if (Array.isArray(q[3])){   // matching: answers stay in row order, 1 point per right row
      const picked = (r.ans[i] || []).slice(), right = mRight(q, perm, c.salt), pts = right.filter((k, rw) => k >= 0 && picked[rw] === k).length;
      return { n: i + 1, bi: bi, q: q, perm: perm, picked: picked, right: right, m: true, pts: pts, max: q[3].length, ok: pts === q[3].length };
    }
    const picked = (r.ans[i] || []).slice().sort((a, b) => a - b);
    const right = perm.map((oi, k) => q[2].includes(oh(c.salt, q[1][oi])) ? k : -1).filter(k => k >= 0);
    return { n: i + 1, bi: bi, q: q, perm: perm, picked: picked, right: right, ok: picked.length > 0 && picked.join(',') === right.join(',') };
  });
}

/* =====================================================================
   FAIRER GUARD (2026-11-06)
   What the live channel showed for one lesson: 8 of 20 tests were annulled — 4 for "focus left the
   page" while the page stayed on screen, 3 after camera warnings (one student got 3 "face not
   visible" warnings in 20 seconds), 1 for leaving the page.
   Changes, keeping the anti-cheat intact:
   • focus leaves the page but the page stays on screen (notification shade pulled down, the address
     bar or the browser menu tapped, a battery pop-up): a warning in the same 3-warning count; only
     if the student does not come back within 4 s is the test annulled. Leaving the page or the
     screen going off is still an immediate 0.
   • the system "back" gesture no longer annuls: the page simply stays on the test.
   • pull-to-refresh is switched off during the test (a stray downward swipe used to reload = 0).
   • the screen is kept awake again if the phone drops the wake lock.
   • "face not visible" can repeat only after the face has been seen again, or after 20 more seconds.
   • a student who was in the waiting room on time is let in even if the camera finished loading
     more than 2 minutes after the start.
   • the phone's clock error is measured from the channel's answer too, not only from the live stream.
   ===================================================================== */
const GUARD = { blurMs: 4000, blip: 500, blurCool: 3000, awayAgain: 20000 };
function guardBlur(){
  if (!G.on || G.blurT) return;
  G.blurAt = Date.now();
  G.blurT = setTimeout(() => { G.blurT = 0; if (G.on && !document.hasFocus()) violate('blur'); }, GUARD.blurMs);
}
function guardFocus(){
  if (!G.blurT) return;
  clearTimeout(G.blurT); G.blurT = 0;
  if (!G.on || document.hidden) return;
  const away = Date.now() - G.blurAt;
  if (away >= GUARD.blip) guardWarn('blur');
  guardWake();
}
function guardBack(){
  try { history.pushState({ damu: 1 }, '', location.href); } catch(e){}
  let b = $('#cambar');
  if (!b){ b = document.createElement('div'); b.id = 'cambar'; b.setAttribute('role', 'alert'); document.body.appendChild(b); }
  b.innerHTML = '<b>Тест жалғасып жатыр</b><span>Тест кезінде артқа өтуге болмайды.</span>';
  b.className = 'show'; clearTimeout(b._t); b._t = setTimeout(() => { b.className = ''; }, 2500);
}
function guardWake(){
  if (!G.on || G.wl || G.wlAsk || !navigator.wakeLock || document.hidden) return;
  G.wlAsk = true;
  try {
    navigator.wakeLock.request('screen').then(l => {
      G.wlAsk = false; if (!G.on){ try { l.release(); } catch(e){} return; }
      G.wl = l; l.addEventListener('release', () => { if (G.wl === l) G.wl = null; });
    }).catch(() => { G.wlAsk = false; });
  } catch(e){ G.wlAsk = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) guardWake(); });
/* a warning that does not come from the camera (focus left the page) — same count, same banner */
function guardWarn(kind){
  const t = Date.now();
  if (!G.on || (G.lastFocusWarn && t - G.lastFocusWarn < GUARD.blurCool)) return;
  G.lastFocusWarn = t;
  CAM.warns.push(kind);
  const n = CAM.warns.length, last = n >= CAMCFG.max;
  camBuzz(last);
  if (S.rec) setRec(Object.assign({}, S.rec, { warns: CAM.warns.slice() }));
  camBanner(n, kind, last);
  if (last){ violate(kind === 'blur' ? 'blur3' : 'cam'); return; }
  live('WARN', Object.assign({}, S.rec, { warn: n, wk: kind }));
  camPaint();
}

/* =====================================================================
   ҰБТ SECTION (#ubt) — practice tests in the ҰБТ format, kept apart from the lesson tests.
   No restrictions here: leaving the page, notifications, other apps are all fine; no camera,
   no synchronized start, no time limit. Answers are saved on the device after every tap, so a
   student can close the page and carry on later. A small calculator (+ − × ÷ √) sits at the
   bottom of the test. Scoring follows the ҰБТ rules: parts I–II 1 point each; part III
   (matching) 2 points, 1 per row; part IV (one or more right answers out of six) 2/1/0 by the
   official table. Results go to the teacher's page through the same live channel.
   ===================================================================== */
const U = { id: '', d: null, rec: null, tick: 0, seg: 0, saveN: 0, sendState: null, fresh: false, rvAll: false, ctxOpen: true };
function ubtKey(id){ return 'damu_ubt_' + UBT[id].id; }
function ubtRec(id){ const r = store.get(ubtKey(id), null); return r && typeof r === 'object' && r.st && Array.isArray(r.ans) ? r : null; }
function ubtSave(id, rec){ id = id || U.id; rec = rec || U.rec; if (id && rec) store.set(ubtKey(id), rec); }
function ubtPartOf(d, n){ return d.parts.find(p => n >= p.from && n <= p.to); }
function ubtMax(d){ return d.q.reduce((a, q) => a + ubtPartOf(d, q.n).pts, 0); }
function ubtTag(t){ return { one: 'Бір жауап', ctx: 'Контекстік', match: 'Сәйкестендіру', multi: 'Бірнеше жауап' }[t]; }
function ubtEmpty(q){ return q.t === 'match' ? [-1, -1] : []; }
function uFull(q, a){ a = a || []; return q.t === 'match' ? a[0] >= 0 && a[1] >= 0 : a.length > 0; }
function uSome(q, a){ a = a || []; return q.t === 'match' ? a[0] >= 0 || a[1] >= 0 : a.length > 0; }
/* right answers from the hashes: option indices (matching: one index per row) */
function uRight(d, q){
  if (q.t === 'match') return [0, 1].map(r => q.o.findIndex(t => oh(d.salt, q.n + '|' + 'AB'[r] + '|' + t) === q.h[r]));
  return q.o.map((t, k) => q.h.includes(oh(d.salt, q.n + '|' + t)) ? k : -1).filter(k => k >= 0);
}
/* points by the ҰБТ rules */
function uPts(d, q, a){
  a = a || []; const R = uRight(d, q);
  if (q.t === 'match') return [0, 1].filter(r => a[r] >= 0 && a[r] === R[r]).length;
  if (q.t === 'multi'){
    const c = a.filter(k => R.includes(k)).length, w = a.length - c, C = R.length;
    if (w >= 2 || c === 0) return 0;          // two or more wrong picks, or no right pick
    if (c === C && w === 0) return 2;         // exactly the right answers
    if (C === 3) return c >= 2 ? 1 : 0;       // three right: two of them (± one wrong) or all three + one wrong
    return 1;                                 // one or two right: the rest of the cases give 1
  }
  return a.length === 1 && a[0] === R[0] ? 1 : 0;
}
/* the short solution, scrambled with a key made from the right answer */
function uNote(d, q){
  const R = uRight(d, q); if (!R.length || R.some(k => k < 0)) return null;
  const key = d.salt + '|' + q.n + '|' + (q.t === 'match' ? R.map(k => q.o[k]).join('\u0001') : R.map(k => q.o[k]).sort().join('\u0001'));

    const bin = atob(q.x), ks = xBytes(key, bin.length), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) ^ ks[i];
    const o = JSON.parse(new TextDecoder().decode(u)); return o && Array.isArray(o.s) ? o : null;
  } catch(e){ return null; }
}

function uClock(ms){ const s = Math.floor(Math.max(0, ms || 0) / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), p = n => String(n).padStart(2, '0'); return (h ? h + ':' + p(m) : m) + ':' + p(s % 60); }

/* long answers: on a phone the drop-down goes under its row instead of beside it */

/* the drop-down of a matching row */
function uddClose(){
  $$('.udd-l').forEach(l => { if (!l.hidden){ l.hidden = true; l.previousElementSibling.setAttribute('aria-expanded', 'false'); } });
  const sp = $('.spacer'); if (sp && sp.dataset.h0 != null){ sp.style.height = sp.dataset.h0; delete sp.dataset.h0; }
}
function uddOpen(b){
  const l = b.nextElementSibling; l.classList.remove('up'); l.hidden = false; b.setAttribute('aria-expanded', 'true');
  // keep the whole list above the bottom bar: scroll the page, or open the list upwards if the page cannot scroll that far
  const nav = $('.snav'), bar = $('.ubar') || $('.tbar'), lim = () => (nav ? nav.getBoundingClientRect().top : window.innerHeight) - 8;
  let over = l.getBoundingClientRect().bottom - lim();
  if (over > 0){
    // a short page cannot scroll far enough: lengthen the empty space under the task while the list is open
    const sp = $('.spacer'), room = document.documentElement.scrollHeight - window.innerHeight - window.pageYOffset;
    if (sp && room < over){ if (sp.dataset.h0 == null) sp.dataset.h0 = sp.style.height || ''; sp.style.height = (sp.offsetHeight + over - room + 12) + 'px'; }
    window.scrollBy({ top: over, behavior: 'instant' }); over = l.getBoundingClientRect().bottom - lim();
  }
